name: Review User 1 validation

on:
  push:
    branches:
      - repair/user1-visible-envelope-convergence-0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-current-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: User 1 defined workpiece and Store convergence
        run: |
          node tests/cutoff-hold-sequence.test.mjs
          node tests/start-own-live-store-origin.test.mjs
          node tests/store-convergence-current-surface.test.mjs
      - name: Navigation regression
        run: |
          node tests/proof-navigation-housekeeping.test.mjs
      - name: Protected Alcove regressions
        run: |
          node tests/alcove-actor-handoff-final.test.mjs
          node tests/alcove-commercial-journey.test.mjs
          node tests/alcove-exact-entry.test.mjs
          node tests/alcove-restore-and-correct.test.mjs
      - name: Protected Window Seat regression
        run: |
          node tests/window-seat-actor-handoff-mirror.test.mjs
