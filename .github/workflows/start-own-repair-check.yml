name: Start Own repair check

on:
  push:
    branches:
      - repair/start-own-visible-integration-0.1

jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cutoff and lineage
        run: node tests/cutoff-hold-sequence.test.mjs
      - name: Start Own live Store origin
        run: node tests/start-own-live-store-origin.test.mjs
      - name: Five-project convergence and protected paths
        run: node tests/store-convergence-current-surface.test.mjs
