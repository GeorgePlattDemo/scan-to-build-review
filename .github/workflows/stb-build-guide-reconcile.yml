name: STB build guide reconcile

on:
  push:
    branches:
      - edit/build-guide-reconcile-0.1

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit/build-guide-reconcile-0.1

      - name: Replace only the Critical Fit build guide
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('system-build-current.html')
          s = p.read_text()

          old = '''<aside class="rail"><p class="hd">BUILD GUIDE</p><p class="goal">Goal</p><div class="row"><b>Room ≠ unit</b><span>Capture establishes context. User 1 sets the furniture.</span></div><div class="row"><b>Show her decisions</b><span>Height, width, depth, shelves and material stay visible beside the tool.</span></div><div class="row"><b>Generate the result</b><span>Definition, material and reference price stay on the page together.</span></div><div class="row"><b>Do not hide the basis</b><span>The human reason and Store math are both visible.</span></div></aside>'''

          new = '''<aside class="rail"><p class="hd">BUILD GUIDE</p><p class="goal">Reconcile in order</p><div class="row"><b>01 · Preserve the source</b><span>Keep the scan, measurements and notes as evidence. Do not turn an approximation into a controlling number.</span></div><div class="row"><b>02 · Separate room from unit</b><span>94½ in describes the room. Unit height is a user decision made inside that room.</span></div><div class="row"><b>03 · Establish controlling dimensions</b><span>Carry measured opening and available depth separately from the choices derived from them.</span></div><div class="row"><b>04 · Capture the human decisions</b><span>Height, width, depth, shelf count, shelf elevations and material belong to User 1. Keep the reason beside the value.</span></div><div class="row"><b>05 · Preserve fit intent</b><span>A full-width fit is not the same as a clearance allowance. If the user prefers field trimming, record that preference instead of silently shrinking the unit.</span></div><div class="row"><b>06 · Derive; do not redraw</b><span>Interior span comes from configured width less the two class side members. One accepted definition drives the downstream numbers.</span></div><div class="row"><b>07 · Bind one state to every view</b><span>Move a control once. The drawing, labels, generated definition and later review must all change from the same state.</span></div><div class="row"><b>08 · Keep geometry and taste together</b><span>Mantel alignment, room scale and shelf placement are human requirements too. They are not noise to strip out of the engineering record.</span></div><div class="row"><b>09 · Resolve material against a source</b><span>Map the definition to the reference Store catalog and required stock. Do not invent an SKU, quantity or availability fact in the application.</span></div><div class="row"><b>10 · Calculate economics from the same facts</b><span>Stock count, modeled operations and Store rules produce the reference amount. Modeled time stays modeled; estimate stays estimate.</span></div><div class="row"><b>11 · Generate the result visibly</b><span>Definition, material requirement and price basis stay on the page together so the consequence of each choice is inspectable.</span></div><div class="row"><b>12 · Propagate one identified version</b><span>Review and Request must repeat the same geometry and material facts. A changed definition becomes a new version, not an edit to history.</span></div><div class="row"><b>13 · Preserve authority boundaries</b><span>Definition is not order. Order is not payment. Payment is not allocation. Allocation is not release. Release is not Cycle Start.</span></div><div class="row"><b>14 · Test the chain</b><span>Exercise every control and cross-check drawing → definition → Store basis → Review → Request. If they disagree, the build is not reconciled.</span></div><div class="row"><b>Why this is buildable</b><span>No single step is exotic: retain evidence, ask the person, do bounded arithmetic, use declared sources, keep authorities separate, and refuse to hide disagreements.</span></div></aside>'''

          if s.count(old) != 1:
              raise SystemExit(f'expected one current Critical Fit build guide, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)

          assert s.count('How User 1 defined the starting version') == 1
          assert s.count('RESULTING DEFINITION / REFERENCE ORDER — USER 1') == 1
          assert s.count('Reconcile in order') == 1
          assert s.count('Why this is buildable') == 1
          PY

          node -e "const fs=require('fs'),s=fs.readFileSync('system-build-current.html','utf8'),m=s.match(/<script>([\\s\\S]*)<\\/script>/); if(!m) throw new Error('script not found'); new Function(m[1]);"

      - name: Commit only the net walkthrough change
        run: |
          git config user.name "Scan-to-Build bounded edit"
          git config user.email "actions@users.noreply.github.com"
          git add system-build-current.html
          git diff --cached --name-only | grep -qx 'system-build-current.html'
          git rm -f .github/workflows/stb-build-guide-reconcile.yml
          git add -A
          git diff --cached --name-only | grep -qx 'system-build-current.html'
          git commit -m "Turn Critical Fit build guide into reconciliation spine"
          git push origin HEAD:edit/build-guide-reconcile-0.1
