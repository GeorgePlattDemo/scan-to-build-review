name: STB critical fit configurator cleanup

on:
  push:
    branches:
      - edit/critical-fit-configurator-0.1

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit/critical-fit-configurator-0.1

      - name: Apply bounded critical-fit cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('system-build-current.html')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              s = s.replace(old, new, 1)

          old_scan = '''<div class="call"><p style="font-weight:600;margin-bottom:6px">What we keep from each</p><p class="dim"><b style="color:var(--text)">Scan</b> — the shape, and the fact that it came from a scan.</p><p class="dim"><b style="color:var(--text)">Your measurements</b> — the numbers, how you took them, and how many times.</p><p class="dim" style="margin:0"><b style="color:var(--text)">What's off</b> — slope, bow, twist. Recorded, not corrected.</p></div>'''
          new_scan = '''<div class="call"><p style="font-weight:600;margin-bottom:6px">What we keep from each</p><p class="dim"><b style="color:var(--text)">Scan</b> — the shape, and the fact that it came from a scan.</p><p class="dim"><b style="color:var(--text)">Your measurements</b> — Height 94½ in floor to ceiling · Width 45½ in opening · Depth 14½ in available at the face.</p><p class="dim"><b style="color:var(--text)">Resolution</b> — controlling measurements are recorded to the nearest 1/32 in. The scan stays supporting context.</p><p class="dim" style="margin:0"><b style="color:var(--text)">What's off</b> — floor slopes 1.2° and the recessed wall bows in ½ in. Recorded, not corrected.</p></div>'''
          replace_once(old_scan, new_scan, 'scan measurement summary')

          old_left = '''<div style="min-width:0"><svg id="alcove-draw" viewBox="0 0 300 210" style="width:100%;display:block;background:#f2ece2;border-radius:9px"></svg></div><div class="ctl">'''
          new_left = '''<div style="min-width:0"><svg id="alcove-draw" viewBox="0 0 300 210" style="width:100%;display:block;background:#f2ece2;border-radius:9px"></svg><div class="call" style="margin:10px 0 0"><p style="font-weight:600;margin-bottom:6px">Why User 1 chose this</p><p class="dim"><b style="color:var(--text)">Width</b> — 45½ in is the controlling opening. The 44 in nominal interior span is only the opening less two ¾ in side members; no fit allowance has been added.</p><p class="dim"><b style="color:var(--text)">Depth</b> — 14½ in was measured at the face. User 1 chose 14 in so the shelf fronts stay ½ in behind the face instead of sticking out.</p><p class="dim"><b style="color:var(--text)">Shelves</b> — five. The 45 in shelf lines up with the mantel; the 65 in top shelf is a taste choice.</p><p class="dim" style="margin:0"><b style="color:var(--text)">Resolution</b> — controlling dimensions are carried to the nearest 1/32 in. The scan remains supporting context.</p></div></div><div class="ctl">'''
          replace_once(old_left, new_left, 'visible User 1 reasoning')

          old_controls = '''<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px"><span style="font-weight:600">Shelves</span><span style="font-size:11px;color:var(--text3)" id="v-n">5</span></div><input id="c-n" type="range" min="2" max="7" value="5" style="width:100%;margin-bottom:10px;accent-color:var(--accent)"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px"><span style="font-weight:600">Depth</span><span style="font-size:11px;color:var(--text3)" id="v-d">14 in</span></div><input id="c-d" type="range" min="8" max="16" step="1" value="14" style="width:100%;margin-bottom:10px;accent-color:var(--accent)"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px"><span style="font-weight:600">Heights</span><button id="fmt" style="font-size:10px;padding:2px 7px">fractions</button></div>'''
          new_controls = '''<div class="control"><label><span>Height</span><span>94½ in · captured</span></label><p class="dim" style="margin:2px 0 0;font-size:10.5px">Floor to ceiling from the measured space.</p></div><div class="control"><label><span>Width</span><span>45½ in · controlling</span></label><p class="dim" style="margin:2px 0 0;font-size:10.5px">Opening width carried from capture.</p></div><div class="control"><label><span>Depth</span><span id="v-d">14 in · from 14½ measured</span></label><input id="c-d" type="range" min="8" max="16" step="0.03125" value="14"></div><div class="control"><label><span>Shelves</span><span id="v-n">5 shelves</span></label><input id="c-n" type="range" min="2" max="7" value="5"></div><div style="display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 4px"><span style="font-weight:600">Shelf heights</span><button id="fmt" style="font-size:10px;padding:2px 7px">fractions</button></div>'''
          replace_once(old_controls, new_controls, 'control order')

          replace_once('<details class="how"><summary>HOW WAS THIS FIGURED?</summary>',
                       '<details class="how"><summary>STORE / PRICE BASIS</summary>',
                       'price basis disclosure label')

          replace_once("const w=Math.floor(v),e=Math.round((v-w)*16);if(e===0)return''+w;if(e===16)return''+(w+1);let d=16,nu=e;",
                       "const w=Math.floor(v),e=Math.round((v-w)*32);if(e===0)return''+w;if(e===32)return''+(w+1);let d=32,nu=e;",
                       '1/32 fraction formatter')

          replace_once("document.getElementById('v-d').textContent=d+' in';",
                       "document.getElementById('v-d').textContent=fmt(d)+' in · from 14½ measured';",
                       'depth display')

          replace_once("document.getElementById('p-cfg').textContent=sp.name+' · '+n+' shelves · '+d+' in deep';",
                       "document.getElementById('p-cfg').textContent=sp.name+' · '+n+' shelves · '+fmt(d)+' in deep';",
                       'configuration depth display')

          replace_once("document.getElementById('r-d').textContent=d+' in';",
                       "document.getElementById('r-d').textContent=fmt(d)+' in';",
                       'review depth display')

          replace_once("+' in deep · '+across+' across</text>';",
                       "+fmt(d)+' in deep · '+across+' across</text>';",
                       'drawing depth display')

          replace_once("${d}″ deep",
                       "${fmt(d)}″ deep",
                       'request depth display')

          p.write_text(s)
          PY

          git diff --check -- system-build-current.html
          grep -F 'Height</span><span>94½ in · captured' system-build-current.html
          grep -F 'Width</span><span>45½ in · controlling' system-build-current.html
          grep -F '14½ in was measured at the face. User 1 chose 14 in' system-build-current.html
          grep -F 'nearest 1/32 in' system-build-current.html
          grep -F 'STORE / PRICE BASIS' system-build-current.html
          grep -F 'step="0.03125"' system-build-current.html

      - name: Commit only the walkthrough correction
        run: |
          git rm .github/workflows/stb-critical-fit-configurator-cleanup.yml
          git config user.name 'Scan-to-Build bounded edit'
          git config user.email 'actions@users.noreply.github.com'
          git add system-build-current.html
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/stb-critical-fit-configurator-cleanup.yml system-build-current.html "
          git commit -m 'Clarify critical-fit capture and configurator'
          git push origin HEAD:edit/critical-fit-configurator-0.1
