name: STB critical fit human definition

on:
  push:
    branches:
      - edit/critical-fit-human-definition-0.1

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit/critical-fit-human-definition-0.1
      - name: Apply and validate bounded correction
        run: |
          python .github/stb-critical-fit-human-definition.py
          git diff --check -- system-build-current.html
          python -c "from pathlib import Path; import re; s=Path('system-build-current.html').read_text(); Path('/tmp/stb-script.js').write_text('\\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))"
          node --check /tmp/stb-script.js
          grep -F 'RESULTING DEFINITION / REFERENCE ORDER — USER 1' system-build-current.html
          grep -F 'id="c-h"' system-build-current.html
          grep -F 'id="c-w"' system-build-current.html
      - name: Commit only net walkthrough change
        run: |
          git rm .github/stb-critical-fit-human-definition.py
          git rm .github/workflows/stb-critical-fit-human-definition.yml
          git config user.name 'Scan-to-Build bounded edit'
          git config user.email 'actions@users.noreply.github.com'
          git add system-build-current.html
          git diff --cached --name-only | sort
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/stb-critical-fit-human-definition.py .github/workflows/stb-critical-fit-human-definition.yml system-build-current.html "
          git commit -m 'Restore User 1 unit definition and narrative'
          git push origin HEAD:edit/critical-fit-human-definition-0.1
