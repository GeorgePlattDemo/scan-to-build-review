name: STB critical fit validation

on:
  push:
    branches:
      - edit/critical-fit-configurator-0.1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit/critical-fit-configurator-0.1
      - name: Validate HTML and script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('system-build-current.html').read_text()
          assert 'Height</span><span>94½ in · captured' in s
          assert 'Width</span><span>45½ in · controlling' in s
          assert 'step="0.03125"' in s
          assert 'Why User 1 chose this' in s
          assert 'STORE / PRICE BASIS' in s
          assert 'Depth 14½ in available at the face' in s
          assert 'nearest 1/32 in' in s
          ids = re.findall(r'\bid="([^"]+)"', s)
          dupes = sorted({x for x in ids if ids.count(x) > 1})
          if dupes:
              raise SystemExit(f'duplicate ids: {dupes}')
          m = re.search(r'<script>(.*)</script>', s, re.S)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/stb.js').write_text(m.group(1))
          PY
          node --check /tmp/stb.js
          git diff --check
      - name: Remove temporary validation workflow
        run: |
          git rm .github/workflows/stb-critical-fit-validate.yml
          git config user.name 'Scan-to-Build bounded edit'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore: remove temporary critical-fit validation'
          git push origin HEAD:edit/critical-fit-configurator-0.1
