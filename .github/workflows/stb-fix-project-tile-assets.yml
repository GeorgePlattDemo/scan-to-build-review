name: STB fix project tile asset references

'on':
  push:
    branches: ['fix/project-tile-image-assets-0.2']

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage project tile asset reference repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair only project tile image references and subtitle
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('system-build-current.html')
          s = p.read_text()
          replacements = [
              ('assets/project-tiles/start-your-own.png', 'assets/project-tiles/start-your-own.webp'),
              ('assets/project-tiles/plywood-curvilinear-shapes.png', 'assets/project-tiles/plywood-curvilinear-shapes.webp'),
              ('Dimensional definition · sheet stream', 'Sheet stream shapes definition'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {s.count(old)}')
              s = s.replace(old, new, 1)
              if s.count(new) != 1:
                  raise SystemExit(f'verification failed for {new!r}')
          p.write_text(s)
          PY
          git diff --check -- system-build-current.html
      - name: Commit bounded repair and remove temporary workflow
        run: |
          git rm .github/workflows/stb-fix-project-tile-assets.yml
          git config user.name 'Scan-to-Build bounded edit'
          git config user.email 'actions@users.noreply.github.com'
          git add system-build-current.html
          git commit -m 'Repair project tile images and sheet-stream wording'
          git push origin HEAD:fix/project-tile-image-assets-0.2
