name: STB fix project tile image references

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message == 'chore: stage project tile image reference fix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix only the two image references and sheet-stream wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('system-build-current.html')
          s = p.read_text()
          replacements = [
              ('assets/project-tiles/start-your-own.png', 'assets/project-tiles/start-your-own.webp'),
              ('assets/project-tiles/plywood-curvilinear-shapes.png', 'assets/project-tiles/plywood-curvilinear-shapes.webp'),
              ('title="Plywood curvilinear shapes · dimensional definition"', 'title="Plywood curvilinear shapes · Sheet stream shapes definition"'),
              ('<span class="t2">Dimensional definition · sheet stream</span>', '<span class="t2">Sheet stream shapes definition</span>'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, found {s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          for path in [Path('assets/project-tiles/start-your-own.webp'), Path('assets/project-tiles/plywood-curvilinear-shapes.webp')]:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing image asset: {path}')
          PY
          git diff --check -- system-build-current.html
          grep -F 'assets/project-tiles/start-your-own.webp' system-build-current.html
          grep -F 'assets/project-tiles/plywood-curvilinear-shapes.webp' system-build-current.html
          grep -F 'Sheet stream shapes definition' system-build-current.html
      - name: Commit bounded fix and remove temporary workflow
        run: |
          git rm .github/workflows/stb-fix-project-tile-refs.yml
          git config user.name 'Scan-to-Build bounded edit'
          git config user.email 'actions@users.noreply.github.com'
          git add system-build-current.html
          git commit -m 'Fix project tile image references and sheet-stream label'
          git push origin HEAD:main
