name: STB store zero handoff

on:
  push:
    branches:
      - edit/store-zero-handoff-0.1

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit/store-zero-handoff-0.1
          fetch-depth: 0

      - name: Insert Store Zero orientation without trimming Store page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('system-build-current.html')
          before = p.read_text(encoding='utf-8')

          old_button = '<div class="btns"><button data-go="store">REVIEW AND CONFIRM</button></div>'
          new_button = '<div class="btns"><button data-go="store">SEND TO STORE ZERO</button></div><p class="dim" style="margin:8px 0 0"><b style="color:var(--text)">Sending to Store Zero</b> — a declared reference yard. It will answer with prices, stock and capability, each stamped with what it was answered against.</p>'
          assert before.count(old_button) == 1, f'expected one Store handoff button, found {before.count(old_button)}'

          store_anchor = '<section class="page transaction" id="store"><main class="main"><h1>What happens next</h1>'
          orientation = ('<section class="page transaction" id="store"><main class="main">'
              '<div class="band" style="font-size:12px;line-height:1.55">'
              '<p style="margin:0"><b style="color:var(--text)">Store Zero is a declared reference lumberyard.</b> '
              'It is not a real dealer and it is not a mock-up. It is a complete, pinned answering surface, built so that a request has something specific to be answered by. '
              'It carries a catalog of SKUs with unit prices and a catalog clock. It carries declared on-hand quantities, which are stated figures and not physical counts. '
              'It carries a declared machine envelope for dimensional cell D-001 and sheet cell S-001, a declared list of the secondary operations it will and will not perform, declared economics covering mark-on, cell recovery and the cycle model, and a named owner and cell steward whose resolution authority is declared per condition class. '
              'Every answer it returns carries its basis and its pins: which catalog clock, which engine version, which commit. That is what makes receipt of an order auditable rather than merely plausible. '
              'Send the same request twice against the same pins and the same number comes back. Send it after something moved and a different number comes back, and the record will say what moved, when, and who declared it. '
              'Store Zero holds no commercial authority, no live inventory, no payment, and no production release.</p></div>'
              '<h1>What happens next</h1>')
          assert before.count(store_anchor) == 1, f'expected one Store page anchor, found {before.count(store_anchor)}'

          original_store_suffix = before[before.index('<h1>What happens next</h1>'):]
          after = before.replace(old_button, new_button, 1).replace(store_anchor, orientation, 1)
          new_store_suffix = after[after.index('<h1>What happens next</h1>'):]
          assert original_store_suffix == new_store_suffix, 'existing Store content after the orientation was altered'
          assert after.count('Store Zero is a declared reference lumberyard.') == 1
          assert after.count('SEND TO STORE ZERO') == 1
          assert 'REVIEW AND CONFIRM</button></div>' not in after
          p.write_text(after, encoding='utf-8')
          PY

      - name: Validate bounded edit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          text = Path('system-build-current.html').read_text(encoding='utf-8')
          assert text.count('Store Zero is a declared reference lumberyard.') == 1
          assert text.count('Every answer it returns carries its basis and its pins:') == 1
          assert text.count('SEND TO STORE ZERO') == 1
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          Path('/tmp/stb-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          subprocess.run(['node', '--check', '/tmp/stb-inline.js'], check=True)
          PY

      - name: Commit only the net walkthrough change
        shell: bash
        run: |
          git config user.name "Scan-to-Build bounded edit"
          git config user.email "actions@users.noreply.github.com"
          git add system-build-current.html
          git rm .github/workflows/stb-store-zero-handoff.yml
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n' '.github/workflows/stb-store-zero-handoff.yml' 'system-build-current.html' | sort)"
          test "$staged" = "$expected"
          git commit -m "Add declared Store Zero handoff orientation"
          git push origin HEAD:edit/store-zero-handoff-0.1
