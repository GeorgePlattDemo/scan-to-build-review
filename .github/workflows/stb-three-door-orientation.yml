name: STB three-door orientation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply bounded three-door orientation pass
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('system-build-current.html')
          s = p.read_text()

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              s = s.replace(old, new, 1)

          once(
              '.recovery-nav button[aria-current="step"]{background:var(--tint);color:var(--accent)}',
              '.recovery-nav button[aria-current="step"]{background:var(--tint);color:var(--accent)}.door-preview button[disabled]{cursor:default;opacity:.72}.door-next{margin-top:28px;padding-top:16px;border-top:1px solid var(--border)}.door-next .btns{margin-top:10px}',
              'door orientation styles'
          )

          once(
              '<p class="dim">Nothing costs anything until you say so. Nothing gets cut today.</p><p class="dim">Hitting "Next" will bring you into the system of user 1\'s projects at varying stages.</p><div class="btns"><button data-go="projects">Next →</button></div>',
              '<p class="dim">Nothing costs anything until you say so. Nothing gets cut today.</p><h2>How would you like us to remember you?</h2><p class="dim">If not at all, hit “Later.”</p><div class="btns door-preview"><button disabled>THIS DEVICE</button><button disabled>EMAIL / SIGN IN</button><button disabled>LATER</button></div><div class="door-next"><p class="dim">Hitting "Next" will bring you into the system of user 1\'s projects at varying stages.</p><div class="btns"><button data-go="projects">Next →</button></div></div>',
              'new-user orientation'
          )

          once(
              '<div class="btns"><button data-go="saved">OPEN A PROJECT</button><button data-go="projects">START SOMETHING NEW</button></div>',
              '<h2>What would you like to do?</h2><div class="btns door-preview"><button disabled>RETURN TO A PROJECT</button><button disabled>START SOMETHING NEW</button><button disabled>COMPLETED PROJECTS / RECORDS</button></div><div class="door-next"><p class="dim">Hitting "Next" will bring you into the system of user 1\'s projects at varying stages.</p><div class="btns"><button data-go="projects">Next →</button></div></div>',
              'returning-user orientation'
          )

          once(
              '<p><b>Everything.</b> <span class="dim">Parts, material, what was made and when.</span></p><p class="dim">Hitting "Next" will bring you into the system of user 1\'s projects at varying stages.</p><div class="btns"><button data-go="projects">Next →</button></div>',
              '<p><b>Everything.</b> <span class="dim">Parts, material, what was made and when.</span></p><h2>Bring what you already have</h2><div class="btns door-preview"><button disabled>UPLOAD BUILD PLANS</button><button disabled>UPLOAD PDF / DRAWING</button><button disabled>BRING A TAKEOFF / PART LIST</button></div><div class="door-next"><p class="dim">Hitting "Next" will bring you into the system of user 1\'s projects at varying stages.</p><div class="btns"><button data-go="projects">Next →</button></div></div>',
              'professional orientation'
          )

          p.write_text(s)

          phrase = 'Hitting "Next" will bring you into the system of user 1\'s projects at varying stages.'
          checks = {
              'shared truth appears on all three doors': s.count(phrase) == 3,
              'new user preview': all(x in s for x in ['THIS DEVICE','EMAIL / SIGN IN','>LATER</button>']),
              'returning preview': all(x in s for x in ['RETURN TO A PROJECT','COMPLETED PROJECTS / RECORDS']),
              'professional preview': all(x in s for x in ['UPLOAD BUILD PLANS','UPLOAD PDF / DRAWING','BRING A TAKEOFF / PART LIST']),
              'three shared footer wrappers': s.count('<div class="door-next">') == 3,
              'landing unchanged marker': '<section class="page on" id="landing">' in s,
              'project explanation preserved': 'A bounded project is one somebody already worked out.' in s,
              'post-landing nav preserved': '<nav class="recovery-nav" aria-label="Build pages" hidden>' in s,
          }
          bad = [k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('Verification failed: ' + '; '.join(bad))
          for k in checks:
              print('PASS:', k)
          PY
      - name: Commit three-door pass
        run: |
          if git diff --quiet -- system-build-current.html; then
            echo "No three-door change produced"
            exit 1
          fi
          git diff --check -- system-build-current.html
          git config user.name 'Scan-to-Build bounded edit'
          git config user.email 'actions@users.noreply.github.com'
          git add system-build-current.html
          git commit -m 'Add truthful orientation controls to three entry doors'
          git push origin HEAD:main
