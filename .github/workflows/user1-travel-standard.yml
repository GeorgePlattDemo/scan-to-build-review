name: Job 1 Operable Template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  job1-operable-template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Shared Store contract syntax
        run: node --check stb-store-handoff-contract.js

      - name: Job 1 fulfillment engine syntax
        run: node --check stb-job1-simulated-fulfillment.js

      - name: Job 1 fulfillment gate engine
        run: node tests/job1-full-gate-state-machine.test.mjs

      - name: Job 1 Store authority acceptance
        run: node tests/user1-travel-standard.test.mjs

      - name: Job 1 start-to-finish gate acceptance
        run: node tests/user1-end-to-end-template.test.mjs

      - name: Job 1 navigation integrity
        run: node tests/job1-navigation-integrity.test.mjs

      - name: Job 1 intent and bench preservation
        run: node tests/start-own-live-store-origin.test.mjs

      - name: Shelf-elevation pilot demand preservation
        run: node tests/shelf-pilot-demand.test.mjs

# Deliberate scope:
# This branch proves Job 1 as the operable template.
# Alcove, Window Seat, Outdoor, S-001, and other projects are not acceptance
# blockers here. They must be migrated later to the same governing standard;
# their current failures are evidence of incomplete migration, not a reason to
# weaken Job 1 or reintroduce project-specific Store logic.
