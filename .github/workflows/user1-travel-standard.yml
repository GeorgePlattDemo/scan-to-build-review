name: Job 1 Operable Template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  job1-operable-template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Shared Store contract syntax
        run: node --check stb-store-handoff-contract.js

      - name: Start Own live bridge syntax
        run: node --check stb-user-defined-board-runtime-bridge.js

      - name: Current shell inline syntax
        run: node --test tests/system-build-current-syntax.test.mjs

      - name: Job 1 Store authority acceptance
        run: node tests/user1-travel-standard.test.mjs

      - name: Job 1 start-to-finish gate acceptance
        run: node tests/user1-end-to-end-template.test.mjs

      - name: Job 1 navigation integrity
        run: node tests/job1-navigation-integrity.test.mjs

      - name: Job 1 intent and bench preservation
        run: node tests/start-own-live-store-origin.test.mjs

      - name: Shelf-elevation pilot demand preservation
        run: node tests/shelf-pilot-demand.test.mjs

      - name: Checkout promoted System runtime
        uses: actions/checkout@v4
        with:
          repository: GeorgePlattDemo/scan-to-build-system
          ref: 58471122d8940461ba8b389a223f468490e140b5
          path: .stb-system

      - name: Checkout exact tested Store source
        uses: actions/checkout@v4
        with:
          repository: GeorgePlattDemo/scan-to-build-store
          ref: 39a1b318063f62220c9c20c42200389098e0c687
          path: .stb-store

      - name: Alcove real Store HTTP integration
        env:
          STB_SYSTEM_ROOT: ${{ github.workspace }}/.stb-system
          STB_STORE_ZERO_ROOT: ${{ github.workspace }}/.stb-store
        run: node --test tests/alcove-real-runtime.test.mjs

      - name: Alcove public Railway Store acceptance
        run: node --test tests/alcove-public-runtime.test.mjs

      - name: Start Own public Railway Store acceptance
        run: node --test tests/user1-public-runtime.test.mjs

# Deliberate scope:
# This workflow preserves the Job 1 operable-template acceptance and also proves
# the existing Alcove HTML + bridge against the promoted System runtime and exact
# tested Store source. Window Seat, Outdoor, S-001, and other projects are not
# changed by this Alcove connection pass.
