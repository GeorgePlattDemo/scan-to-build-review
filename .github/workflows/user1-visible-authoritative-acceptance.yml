name: User 1 visible authoritative acceptance

on:
  push:
    branches:
      - repair/user1-authoritative-visible-answer-0.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  STORE_PIN: ab8a4c5d470c310f27fef82683611622ab976168
  STB_STORE_ZERO_ROOT: ${{ github.workspace }}/store-zero

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Review candidate
        uses: actions/checkout@v4

      - name: Checkout exact Store authority
        uses: actions/checkout@v4
        with:
          repository: GeorgePlattDemo/scan-to-build-store
          ref: ab8a4c5d470c310f27fef82683611622ab976168
          path: store-zero

      - name: Verify exact Store identity
        run: |
          test "$(git -C "$STB_STORE_ZERO_ROOT" rev-parse HEAD)" = "$STORE_PIN"
          test -z "$(git -C "$STB_STORE_ZERO_ROOT" status --porcelain)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser acceptance dependency
        run: |
          npm init -y >/dev/null
          npm install --no-save @playwright/test >/dev/null
          npx playwright install --with-deps chromium

      - name: Reproduce generated browser Store package from exact pin
        run: node tools/generate-user1-store-browser-bundle.mjs --check stb-store-zero-user1.generated.js

      - name: Prove generated browser Store behavioral parity with exact Store
        run: node tests/user1-generated-store-parity.test.mjs

      - name: Start candidate static application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/review-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/review-server.pid"
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/system-build-current.html >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/review-server.log"
          exit 1

      - name: Actual promoted-structure browser acceptance
        run: npx playwright test tests/user1-independent-browser.acceptance.spec.mjs --workers=1

      - name: Prove browser acceptance fails on unrepaired Review checkpoint
        run: |
          mkdir -p "$RUNNER_TEMP/before-review"
          git archive 740b510a9688c60e20af93179979dc83fe6b602f | tar -x -C "$RUNNER_TEMP/before-review"
          cp tests/user1-independent-browser.acceptance.spec.mjs "$RUNNER_TEMP/before-review/tests/"
          cd "$RUNNER_TEMP/before-review"
          python3 -m http.server 4174 --bind 127.0.0.1 > "$RUNNER_TEMP/before-review-server.log" 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4174/system-build-current.html >/dev/null && break
            sleep 1
          done
          set +e
          STB_REVIEW_URL=http://127.0.0.1:4174 "$GITHUB_WORKSPACE/node_modules/.bin/playwright" test tests/user1-independent-browser.acceptance.spec.mjs --workers=1 > "$RUNNER_TEMP/review-before-browser.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/review-before-browser.log"
          test "$rc" -ne 0
          grep -q "data-store-authoritative" "$RUNNER_TEMP/review-before-browser.log"

      - name: Audit existing Review test files against baseline without hiding failures
        run: |
          audit_dir () {
            dir="$1"
            out="$2"
            : > "$out"
            (
              cd "$dir"
              for test_file in tests/*.test.mjs; do
                if node "$test_file" > "$RUNNER_TEMP/one-test.log" 2>&1; then
                  echo "PASS $test_file"
                else
                  echo "FAIL $test_file"
                  echo "$test_file" >> "$out"
                fi
              done
            )
          }
          mkdir -p "$RUNNER_TEMP/review-baseline"
          git archive 740b510a9688c60e20af93179979dc83fe6b602f | tar -x -C "$RUNNER_TEMP/review-baseline"
          audit_dir "$RUNNER_TEMP/review-baseline" "$RUNNER_TEMP/baseline-failures.txt"
          audit_dir "$GITHUB_WORKSPACE" "$RUNNER_TEMP/candidate-failures.txt"
          echo "BASELINE FAILURES"
          cat "$RUNNER_TEMP/baseline-failures.txt"
          echo "CANDIDATE FAILURES"
          cat "$RUNNER_TEMP/candidate-failures.txt"
          comm -13 <(sort "$RUNNER_TEMP/baseline-failures.txt") <(sort "$RUNNER_TEMP/candidate-failures.txt") > "$RUNNER_TEMP/new-failures.txt"
          test ! -s "$RUNNER_TEMP/new-failures.txt"

  fault-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Review candidate
        uses: actions/checkout@v4

      - name: Checkout exact Store authority
        uses: actions/checkout@v4
        with:
          repository: GeorgePlattDemo/scan-to-build-store
          ref: ab8a4c5d470c310f27fef82683611622ab976168
          path: store-zero

      - name: Setup Node and browser
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser acceptance dependency
        run: |
          npm init -y >/dev/null
          npm install --no-save @playwright/test >/dev/null
          npx playwright install --with-deps chromium

      - name: Fault check — incorrect 46-degree SUPPORTABLE is detected
        run: |
          cp stb-store-zero-user1.generated.js "$RUNNER_TEMP/store.bundle.original.js"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("stb-store-zero-user1.generated.js")
          s=p.read_text()
          old='maxDeg: 45,'
          assert old in s
          p.write_text(s.replace(old,'maxDeg: 89,',1))
          PY
          set +e
          STB_STORE_ZERO_ROOT="$GITHUB_WORKSPACE/store-zero" node tests/user1-generated-store-parity.test.mjs > "$RUNNER_TEMP/fault-46.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/fault-46.log"
          test "$rc" -ne 0
          cp "$RUNNER_TEMP/store.bundle.original.js" stb-store-zero-user1.generated.js

      - name: Fault check — visible answer differing from Store answer is detected
        run: |
          rm -rf "$RUNNER_TEMP/fault-visible"
          mkdir -p "$RUNNER_TEMP/fault-visible"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/fault-visible"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("$RUNNER_TEMP/fault-visible/system-build-current.html")
          s=p.read_text()
          old="'$'+Number(estimate.total).toFixed(2)"
          assert old in s
          p.write_text(s.replace(old,"'$999.00'",1))
          PY
          cd "$RUNNER_TEMP/fault-visible"
          python3 -m http.server 4175 --bind 127.0.0.1 > "$RUNNER_TEMP/fault-visible-server.log" 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          set +e
          STB_REVIEW_URL=http://127.0.0.1:4175 "$GITHUB_WORKSPACE/node_modules/.bin/playwright" test tests/user1-independent-browser.acceptance.spec.mjs --workers=1 > "$RUNNER_TEMP/fault-visible.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/fault-visible.log"
          test "$rc" -ne 0

      - name: Fault check — older Store response applied to current revision is detected
        run: |
          rm -rf "$RUNNER_TEMP/fault-revision"
          mkdir -p "$RUNNER_TEMP/fault-revision"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/fault-revision"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("$RUNNER_TEMP/fault-revision/system-build-current.html")
          s=p.read_text()
          old='answerVersionId:storeAnswer.definitionVersionId,'
          assert old in s
          p.write_text(s.replace(old,"answerVersionId:'OLDER-REVISION',",1))
          PY
          cd "$RUNNER_TEMP/fault-revision"
          python3 -m http.server 4176 --bind 127.0.0.1 > "$RUNNER_TEMP/fault-revision-server.log" 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          set +e
          STB_REVIEW_URL=http://127.0.0.1:4176 "$GITHUB_WORKSPACE/node_modules/.bin/playwright" test tests/user1-independent-browser.acceptance.spec.mjs --workers=1 > "$RUNNER_TEMP/fault-revision.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/fault-revision.log"
          test "$rc" -ne 0
