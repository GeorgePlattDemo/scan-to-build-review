<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan-to-Build · Outdoor Build · Project 1</title>
<style>
:root{
  --paper:#F5F0E6;--paper2:#FBF7EF;--surface:#FFFDF8;--stage:#EFE7D8;
  --ink:#2A1E13;--ink2:#6E5C48;--ink3:#9C8A75;--line:#E7DCC9;--line2:#D5C5A9;
  --accent:#A85A2A;--accent2:#8A4520;--tint:#F7E9D6;--good:#5C7A45;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px -12px rgba(60,40,20,.18);
  --lift:0 2px 4px rgba(60,40,20,.06),0 18px 40px -16px rgba(60,40,20,.26);--r:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#14110D;--paper2:#1A1612;--surface:#211C16;--stage:#241E17;
    --ink:#F4EDE1;--ink2:#BDAC97;--ink3:#8B7B68;--line:#332B21;--line2:#4A3E2F;
    --accent:#E09A5F;--accent2:#F2B47C;--tint:#2B2118;--good:#8FB06B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --lift:0 2px 6px rgba(0,0,0,.5),0 22px 46px -18px rgba(0,0,0,.85);
  }
}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1000px 520px at 10% -10%,rgba(168,90,42,.06),transparent 60%),
                   radial-gradient(800px 420px at 95% 4%,rgba(120,90,50,.05),transparent 62%)}
button,input{font:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:26px 22px 80px}
.eyebrow{font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:0 0 14px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.crumb{border:0;background:transparent;color:var(--ink2);padding:7px 0;cursor:pointer}
.crumb:hover{color:var(--ink)}
h1{font-size:clamp(32px,5.4vw,52px);line-height:1.03;letter-spacing:-.03em;margin:0 0 12px;font-weight:650}
h1 em{font-style:normal;color:var(--accent)}
.lede{font-size:clamp(16px,2vw,19px);line-height:1.55;color:var(--ink2);max-width:58ch;margin:0}
.lede strong{color:var(--ink);font-weight:650}
.pathA{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:22px 0 0;padding:14px 16px;
  border:1px dashed var(--line2);border-radius:var(--r);background:var(--paper2)}
.pathA b{display:block;font-size:14.5px}
.pathA span{display:block;font-size:12.5px;color:var(--ink3);max-width:62ch}
.pathA a,.link{color:var(--accent2);font-weight:650;text-decoration:none}
.pathA a:hover,.link:hover{text-decoration:underline;text-underline-offset:2px}
.step{display:flex;align-items:center;gap:12px;margin:40px 0 14px}
.step .n{width:27px;height:27px;flex:none;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:750}
@media (prefers-color-scheme:dark){.step .n{color:#1a1208}}
.step h2{font-size:20px;letter-spacing:-.01em;margin:0}
.step .sub{margin-left:auto;color:var(--ink3);font-size:13px}
.grid3,.grid4,.grid2{display:grid;gap:16px}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{position:relative;display:block;width:100%;text-align:left;cursor:pointer;padding:0;font:inherit;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:.18s}
.card:hover{transform:translateY(-2px);box-shadow:var(--lift);border-color:var(--line2)}
.card.on{border-color:var(--accent);box-shadow:var(--lift),inset 0 0 0 1px var(--accent)}
.card .pic{display:block;width:100%;height:auto;background:linear-gradient(165deg,var(--paper2),var(--stage))}
.card .body{padding:14px 16px 16px}
.card b{display:block;font-size:16px;margin-bottom:3px}
.card span{display:block;color:var(--ink3);font-size:13px;line-height:1.45}
.card .tick{display:none;position:absolute;top:11px;right:11px;width:26px;height:26px;border-radius:50%;
  background:var(--accent);color:#fff;place-items:center;font-weight:800;font-size:13px}
.card.on .tick{display:grid}
@media (prefers-color-scheme:dark){.card .tick{color:#1a1208}}
.note{margin:14px 0 0;padding:13px 15px;border:1px dashed var(--line2);border-radius:12px;background:var(--paper2);font-size:13.5px;color:var(--ink2)}
.note b{color:var(--ink)}
.go{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:26px 0 0;padding:17px 19px;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.go .copy{flex:1;min-width:240px;color:var(--ink2);font-size:14px}
.go .copy b{color:var(--ink)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:12px;padding:12px 22px;
  font-weight:650;cursor:pointer;box-shadow:0 2px 10px -2px rgba(168,90,42,.5);transition:.15s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:disabled{background:var(--surface);color:var(--ink3);border-color:var(--line);box-shadow:none;cursor:not-allowed;filter:none;transform:none}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line);box-shadow:none}
.btn.sm{font-size:13px;padding:8px 13px;border-radius:9px}
@media (prefers-color-scheme:dark){.btn{color:#1a1208}}
.top{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:clamp(28px,4vw,38px);margin:0}
.tag{font-size:12px;color:var(--accent2);background:var(--tint);border:1px solid var(--line2);padding:5px 9px;border-radius:999px}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);overflow:hidden}
.stage svg{width:100%;display:block}
.readout{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 3px 0;font-size:13.5px;color:var(--ink2)}
.readout b{color:var(--ink);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h3{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin:0 0 12px}
.preset{padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--paper2);margin-bottom:13px}
.preset b{display:block;font-size:14px}
.preset span{display:block;font-size:12.5px;color:var(--ink3)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--paper2);color:var(--ink2);border-radius:9px;padding:8px 11px;cursor:pointer;font-size:13px}
.seg button.on{border-color:var(--accent);background:var(--tint);color:var(--accent2);font-weight:650}
.row{display:flex;align-items:center;gap:10px;margin:12px 0}
.row .lab{flex:1;min-width:0;font-size:14px}
.row .lab i{display:block;font-style:normal;font-size:11.5px;color:var(--ink3)}
.num{display:flex;align-items:center;gap:6px}
.num input{width:100px;padding:7px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--paper2);color:var(--ink);font-variant-numeric:tabular-nums}
.num input:focus{outline:2px solid var(--tint);border-color:var(--accent)}
.num .unit{font-size:12px;color:var(--ink3)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--paper2);border-radius:9px;padding:2px}
.stepper button{width:30px;height:30px;border:0;background:transparent;color:var(--ink2);cursor:pointer;border-radius:7px;font-size:17px}
.stepper .v{min-width:38px;text-align:center;font-weight:650}
.help{font-size:12px;line-height:1.5;color:var(--ink3);margin:8px 0 0}
.help strong{color:var(--ink2)}
.customonly{display:none}.custom .customonly{display:block}
.slider{width:100%;accent-color:var(--accent)}
.error{margin:12px 0 0;border:1px dashed var(--accent);background:var(--tint);color:var(--accent2);padding:10px 12px;border-radius:10px;font-size:13px}
.results{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.cut{width:100%;border-collapse:collapse;font-size:13.5px}
.cut th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:0 0 8px;border-bottom:1px solid var(--line)}
.cut td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.cut tr:last-child td{border-bottom:0}
.cut td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.cut .sub{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.buyline{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.buyline .w{flex:1}
.buyline .w b{font-size:14px}
.buyline .w span{display:block;font-size:11.5px;color:var(--ink3)}
.buyline .p{color:var(--ink2);font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:12px 14px;border:1px solid var(--line2);background:var(--tint);border-radius:10px;color:var(--accent2)}
.total b{font-size:23px;font-variant-numeric:tabular-nums}
.boardmap{margin-top:12px;padding:9px;border:1px solid var(--line);background:var(--paper2);border-radius:10px}
.boardmap svg{width:100%;display:block}
.donebar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:20px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.donebar .copy{flex:1;min-width:240px}
.donebar .copy b{display:block;font-size:18px}
.donebar .copy span{font-size:13px;color:var(--ink3)}
.storesentence{font-size:15px;color:var(--ink2);margin:0}
details.fold{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--ink3)}
details summary{cursor:pointer;color:var(--ink2);font-weight:650;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"  +";color:var(--accent)}
details[open] summary:after{content:"  –"}
.foldbody{padding-top:9px;line-height:1.65;max-width:860px}
.version{font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--paper2);border:1px solid var(--line);border-radius:7px;padding:4px 6px}
.proofbox{margin:18px 0;padding:16px 18px;border:1px solid var(--line2);border-radius:var(--r);background:var(--tint)}
.proofbox .k{font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2)}
.proofbox h2{margin:5px 0 6px;font-size:21px}
.proofbox p{margin:0;color:var(--ink2);font-size:13.5px}
.prooflinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.prooflinks a{display:inline-block;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--accent2);font-size:12px;font-weight:650;text-decoration:none}
.prooflinks a:hover{text-decoration:underline;text-underline-offset:2px}
.choicegate{margin:0 0 14px;padding:11px 13px;border:1px dashed var(--line2);border-radius:10px;background:var(--paper2);font-size:12.5px;color:var(--ink2)}
.choicegate b{color:var(--ink)}
.receipt{margin:18px 0;padding:18px 19px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.receipt h2{margin:3px 0 5px;font-size:23px}
.receipt .lead{margin:0 0 14px;color:var(--ink2)}
.receiptgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.receiptbox{padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper2);font-size:12.5px}
.receiptbox b{display:block;margin-bottom:4px}
.receiptbox ul{margin:5px 0 0;padding-left:18px;color:var(--ink2)}
.receiptbox .metric{font-size:22px;color:var(--accent2);font-weight:700}
.match{margin-top:12px;padding:10px 12px;border:1px dashed var(--line2);border-radius:9px;color:var(--ink2);font-size:12.5px}
.match b{color:var(--ink)}
@media(max-width:720px){.receiptgrid{grid-template-columns:1fr}}
.foot{margin-top:48px;font-size:12px;color:var(--ink3);max-width:78ch}
.cutlist{margin:18px 0 0}
@media(max-width:980px){.bench{grid-template-columns:1fr}.results{grid-template-columns:1fr}}
@media(max-width:820px){.grid3,.grid4,.grid2{grid-template-columns:1fr}.step .sub{width:100%;margin-left:39px}}
@media(max-width:560px){.wrap{padding:20px 14px 60px}.row{align-items:flex-start;flex-wrap:wrap}.row .lab{flex-basis:100%}}
</style>

<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>')}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function money(v){return '$'+(Math.round(v*100)/100).toFixed(2)}
function parseInch(s){
  s=String(s||'').trim().replace(/−/g,'-'); if(!s)return NaN;
  if(/^[-+]?\d+(?:\.\d+)?$/.test(s))return Number(s);
  var m=s.match(/^([-+]?\d+)\s+(\d+)\/(\d+)$/); if(m)return Number(m[1])+(Number(m[1])<0?-1:1)*Number(m[2])/Number(m[3]);
  m=s.match(/^([-+]?\d+)-(\d+)\/(\d+)$/); if(m)return Number(m[1])+(Number(m[1])<0?-1:1)*Number(m[2])/Number(m[3]);
  m=s.match(/^([-+]?)(\d+)\/(\d+)$/); if(m)return (m[1]==='-'?-1:1)*Number(m[2])/Number(m[3]);
  return NaN;
}
function fmt(v){
  if(!isFinite(v))return '—'; var sign=v<0?'-':'',a=Math.abs(v),w=Math.floor(a+1e-9),e=Math.round((a-w)*16),d=16;
  if(e===16){w++;e=0} if(!e)return sign+w; while(e%2===0){e/=2;d/=2} return sign+(w?w+' ':'')+e+'/'+d;
}
function hash32(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return ('00000000'+(h>>>0).toString(16).toUpperCase()).slice(-8)}

/* ── cited pins. Do not “improve”. ── */
var REF={
  kerf:.125, board:96,
  leg:16.5, thick:1.5, wid:3.5, seat:18,
  holeEx:[3,7],
  aframe:{L:72, tableH:30.25, tableW:30.5, seatH:17, legLen:32.75, legAng:30, top:'2×8 × 72 in × 4', bench:'2×6 × 68 in × 4', bolts:'½ × 3½ in carriage'},
  mop:{legsEachBench:2, totalLegs:4, support:11.5, tableLeg:26}
};
var BASE={length:REF.leg, h1:REF.holeEx[0], h2:REF.holeEx[1]};
var S={screen:'home', family:null, style:null, part:null, mode:null,
  qty:1, assembly:8, length:BASE.length, h1:BASE.h1, h2:BASE.h2, spot:false, sent:null,
  choices:{quantity:false,length:false,spots:false}};
var METRICS={uiActions:0};

function definition(){
  return {project:'OUTDOOR-BUILD/P1', family:'bench', part:'bench-leg', style:'detached',
    mode:S.mode, qty:S.qty, assembly:S.assembly,
    finishedLength:+S.length.toFixed(5),
    stock:{nominal:'2x4', actualWidth:REF.wid, actualThickness:REF.thick},
    endCondition:'square',
    holeRequirement:S.spot?'MEASURED_SPOTS':'NONE',
    datum:S.spot?'TOP':null,
    holes:S.spot?[{datum:'TOP',down:+S.h1.toFixed(5),cross:'CENTERLINE'},{datum:'TOP',down:+S.h2.toFixed(5),cross:'CENTERLINE'}]:[],
    operation:S.spot?'SPOT_HOLE_LOCATIONS':'CUT_ONLY', raiseAt:'BOTTOM'};
}
function versionId(){return 'OB-P1-'+hash32(JSON.stringify(definition()))}
function validate(){
  var a=[];
  if(!(S.length>=12&&S.length<=30))a.push('Leg length needs to stay between 12 and 30 in for this bounded prototype.');
  if(S.spot){
    if(!(S.h1>=.75&&S.h1<=S.length-.75))a.push('First hole needs to stay on the leg.');
    if(!(S.h2>=.75&&S.h2<=S.length-.75))a.push('Second hole needs to stay on the leg.');
    if(S.h2<=S.h1+.75)a.push('Keep the second hole at least ¾ in below the first.');
  }
  return a;
}
function storeContract(){
  return window.STBStoreHandoffContract || null;
}
function outdoorMaterialResolution(){
  var contract=storeContract();
  if(!contract||typeof contract.resolveStartOwnMaterial!=='function')
    return {status:'UNRESOLVED',code:'STORE_RESOLVER_UNAVAILABLE',details:'Shared Store Zero material resolver is unavailable.'};
  return contract.resolveStartOwnMaterial({
    sizeKey:'2x4',
    parts:[{name:'bench leg',len:S.length,wid:REF.wid,qty:S.qty}]
  });
}
function outdoorStoreAnswer(){
  var r=outdoorMaterialResolution(), supported=(r&&r.supportedOps)||[], unresolved=[];
  if(!r||r.status!=='MAPPED')unresolved.push((r&&r.code)||'STORE_MATERIAL_UNRESOLVED');
  if(supported.indexOf('CROSSCUT')<0)unresolved.push('CROSSCUT_CAPABILITY_UNRESOLVED');
  if(S.spot)unresolved.push('HOLE_SPOTTING_CAPABILITY_UNRESOLVED');
  unresolved.push('UNRESOLVED_CLASS_SCOPED_RECOVERY');
  return {
    status:unresolved.length===1?'SUPPORTED_WITH_UNPRICED_RECOVERY':'NEEDS RESOLUTION',
    material:r&&r.status==='MAPPED'?r.materialTotal:null,
    sku:r&&r.status==='MAPPED'?r.storeSku:null,
    processing:null,
    combined:null,
    complete:false,
    unresolved:unresolved
  };
}
function buildOutdoorHandoff(){
  var contract=storeContract();
  if(!contract||typeof contract.createProjectHandoff!=='function')return null;
  var def=definition(), r=outdoorMaterialResolution(), answer=outdoorStoreAnswer();
  var ops=[{kind:'CROSSCUT',part:'bench-leg',quantity:S.qty,detail:fmt(S.length)+' in finished · square ends'}];
  if(S.spot)ops.push({kind:'SPOT_HOLE_LOCATIONS',part:'bench-leg',quantity:S.qty*2,detail:fmt(S.h1)+' / '+fmt(S.h2)+' in from TOP · centerline',unresolved:true});
  return contract.createProjectHandoff({
    projectId:'outdoor-build',
    projectClass:'BOUNDED_REPLACEMENT_PART',
    authorityKey:'outdoor',
    definitionId:versionId(),
    projectDefinition:def,
    materialDemand:{sizeKey:'2x4',label:'2×4',parts:[{name:'bench leg',len:S.length,wid:REF.wid,qty:S.qty}]},
    operationDemand:ops,
    quantity:S.qty,
    requiredGeometryDatumFacts:{finishedLength:S.length,endCondition:'square',holeRequirement:def.holeRequirement,datum:def.datum},
    materialResolution:r,
    unresolvedConditions:answer.unresolved
  });
}
function boardPlan(){
  var r=outdoorMaterialResolution();
  var stock=r&&r.status==='MAPPED'&&r.stockLengthIn?r.stockLengthIn:REF.board;
  var per=Math.max(1,Math.floor((stock+REF.kerf)/(S.length+REF.kerf)));
  return {
    per:per,
    n:r&&r.status==='MAPPED'?r.quantity:Math.ceil(S.qty/per),
    materialTotal:r&&r.status==='MAPPED'?r.materialTotal:null,
    storeSku:r&&r.status==='MAPPED'?r.storeSku:null,
    stockLength:stock,
    resolution:r
  };
}
function explicitDecisionList(){
  var out=[];
  if(S.choices.quantity)out.push('quantity');
  if(S.choices.length)out.push('finished_length');
  if(S.choices.spots)out.push('hole_spot_requirement');
  return out;
}
function normalizedCore(def){
  if(!def)return null;
  return {
    stockClass:def.stockClass||(def.stock&&def.stock.nominal)||null,
    finishedLength:Number(def.finishedLength),
    quantity:Number(def.quantity!=null?def.quantity:def.qty),
    endCondition:def.endCondition||null,
    holeRequirement:def.holeRequirement||((def.holes&&def.holes.length)?'MEASURED_SPOTS':'NONE'),
    datum:def.datum||((def.holes&&def.holes.length)?'TOP':null)
  };
}
function sameCore(a,b){
  if(!a||!b)return false;
  return a.stockClass===b.stockClass
    && Math.abs(a.finishedLength-b.finishedLength)<0.00001
    && a.quantity===b.quantity
    && a.endCondition===b.endCondition
    && a.holeRequirement===b.holeRequirement
    && a.datum===b.datum;
}
function readJob1Proof(){
  try{return JSON.parse(localStorage.getItem('stb-proof-ladder-job1')||'null')}catch(_){return null}
}
function comparisonReceipt(){
  if(!S.sent)return '';
  var job1=readJob1Proof();
  var job2Core=normalizedCore(S.sent.definition);
  var job1Core=job1&&job1.semanticOutput?normalizedCore(job1.semanticOutput):null;
  var equal=!!(job1&&job1.targetMatch&&sameCore(job1Core,job2Core));
  var job1Decision=job1&&job1.measured?String(job1.explicitProjectDecisionCount):'not measured in this session';

  h+='<div class="top"><button class="crumb" id="backhome">← Outdoor Build</button><h1>Bench leg</h1><span class="tag">DETACHED · PROJECT 1</span></div>';
  h+='<p class="lede">The old leg broke. The bounded project already knows what kind of part this is. <strong>You define what is different this time.</strong></p>';
  h+='<div class="choicegate"><b>Still yours:</b> choose the quantity and say whether this job needs measured hole spots. The cited 16½ in finished length is carried by the bounded reference unless you change it. Quantity 8 is project-specific / user-declared for this demonstration; the cited published plan does not establish eight legs.</div>';
  h+='<div class="bench '+(custom?'custom':'')+'"><div><div class="stage">'+benchSvg()+'</div>'
    +'<div class="readout"><span>Finished leg <b>'+fmt(S.length)+' in</b></span><span>Quantity <b>'+S.qty+'</b></span><span>Reference seat <b>~'+fmt(seat)+' in</b></span><span>Hole datum <b>TOP</b></span>'
    +(S.spot?'<span>Spots <b>'+fmt(S.h1)+' / '+fmt(S.h2)+'</b></span>':'<span>Spots <b>off</b></span>')+'</div></div><div>';
  h+='<section class="panel"><h3>Start point</h3><div class="preset"><b>Detached bench leg · 2×4 · 16½ in</b><span>MyOutdoorPlans 6-ft all-2×4. Square ends. Actual 1½ × 3½ in.</span></div>'
    +'<div class="seg"><button data-modepick="standard" class="'+(S.mode==='standard'?'on':'')+'">Standard geometry</button><button data-modepick="custom" class="'+(S.mode==='custom'?'on':'')+'">Custom</button></div></section>';
  h+='<section class="panel"><h3>How many?</h3><div class="seg"><button data-qtyquick="1" class="'+(S.qty===1?'on':'')+'">One leg</button><button data-qtyquick="'+S.assembly+'" class="'+(S.qty===S.assembly?'on':'')+'">All '+S.assembly+'</button></div>'
    +'<div class="row"><div class="lab">Quantity<i>This prototype’s replacement set is two benches × four legs = 8. The published plan as drawn uses 4 legs for two benches.</i></div><div class="stepper"><button id="qminus">−</button><span class="v">'+S.qty+'</span><button id="qplus">+</button></div></div></section>';
  h+='<section class="panel"><h3>Height</h3><div class="seg"><button data-lift="0" class="'+(Math.abs(S.length-BASE.length)<.001?'on':'')+'">Original height</button><button data-lift="1" class="'+(Math.abs(S.length-(BASE.length+1))<.001?'on':'')+'">+ 1 in</button></div>'
    +'<div class="row"><div class="lab">Finished leg length<i>Extra length goes at the bottom.</i></div><div class="num"><input id="length" value="'+fmt(S.length)+'" inputmode="decimal" aria-label="Finished leg length"><span class="unit">in</span></div></div>'
    +'<div class="customonly"><input class="slider" id="lengthSlider" type="range" min="12" max="30" step="0.25" value="'+S.length+'"></div></section>';
  h+='<section class="panel"><h3>Hole locations</h3><div class="seg"><button id="spotOn" class="'+(S.spot?'on':'')+'">Spot centers</button><button id="spotOff" class="'+(!S.spot?'on':'')+'">No hole spots</button></div>'
    +'<p class="help"><strong>These are not “standard” holes.</strong> The cited plan does not publish distances from TOP. If you spot, 3 in and 7 in are example starting values — measure the old leg. Across: centerline, 1¾ in from either long edge. <b>Spot only</b>; through-drilling is not claimed.</p>';
  if(S.spot){
    h+='<div class="row"><div class="lab">Hole 1 from top</div><div class="num"><input id="h1" value="'+fmt(S.h1)+'" inputmode="decimal"><span class="unit">in</span></div></div>';
    h+='<div class="customonly"><input class="slider" id="h1Slider" type="range" min="0.75" max="'+Math.max(.75,S.length-.75)+'" step="0.25" value="'+S.h1+'"></div>';
    h+='<div class="row"><div class="lab">Hole 2 from top</div><div class="num"><input id="h2" value="'+fmt(S.h2)+'" inputmode="decimal"><span class="unit">in</span></div></div>';
    h+='<div class="customonly"><input class="slider" id="h2Slider" type="range" min="0.75" max="'+Math.max(.75,S.length-.75)+'" step="0.25" value="'+S.h2+'"></div>';
  }
  h+='</section>';
  if(errs.length)h+='<div class="error">'+errs.map(esc).join('<br>')+'</div>';
  var unanswered=[];
  if(!S.choices.quantity)unanswered.push('quantity');
  if(!S.choices.spots)unanswered.push('hole-spot requirement');
  if(unanswered.length)h+='<div class="choicegate"><b>Before this definition can be sent:</b> answer '+unanswered.join(', ')+'.</div>';
  h+='</div></div>';
  h+='<div class="results"><section class="panel"><h3>Cut list</h3><table class="cut"><thead><tr><th>Part</th><th>Definition</th><th>Qty</th></tr></thead><tbody>'
    +'<tr><td><b>Bench leg</b><span class="sub">2×4 · square ends</span></td><td>'+fmt(S.length)+' in finished<span class="sub">extra length at bottom</span></td><td>'+S.qty+'</td></tr>'
    +(S.spot?'<tr><td><b>Hole spots</b><span class="sub">center marks only · TOP datum</span></td><td>'+fmt(S.h1)+' / '+fmt(S.h2)+' in from TOP<span class="sub">on board centerline</span></td><td>'+(S.qty*2)+'</td></tr>':'')
    +'</tbody></table><p class="help">Change the definition and this list changes with it. Saw kerf '+fmt(REF.kerf)+' in.</p></section>';
  var storePlanText=plan.resolution&&plan.resolution.status==='MAPPED'
    ? plan.n+' × 2×4 × '+plan.stockLength+' in · '+plan.storeSku
    : 'Store material resolution unresolved';
  h+='<section class="panel"><h3>What Store Zero maps</h3><div class="buyline"><div class="w"><b>'+storePlanText+'</b><span>Material answer from the pinned Store Zero catalog</span></div><div class="p">'+(plan.materialTotal==null?'—':money(plan.materialTotal))+'</div></div>'
    +'<div class="boardmap">'+boardSvg()+'</div>'
    +'<div class="total"><span>Material</span><b>'+(plan.materialTotal==null?'Not established':money(plan.materialTotal))+'</b></div>'
    +'<p class="help">Processing / fulfillment recovery is not established for this project class. No complete price is invented here.</p></section></div>';
  h+='<div class="donebar"><div class="copy"><b>That is a project.</b><span>'+S.qty+' replacement leg'+(S.qty===1?'':'s')+', '+fmt(S.length)+' in finished'+(S.spot?', with '+(S.qty*2)+' hole centers spotted from TOP':'')+'.</span></div>'
    +'<button class="btn" id="send" '+((errs.length||unanswered.length)?'disabled':'')+'>Looks right — send to Store</button></div>';
  if(S.sent){
    var current=versionId(), stale=current!==S.sent.id, answer=S.sent.storeAnswer||outdoorStoreAnswer(), resolution=S.sent.materialResolution||outdoorMaterialResolution();
    var sentence=stale
      ?'You changed the part after sending it. Send the new version when it looks right.'
      :(resolution&&resolution.status==='MAPPED'
        ?resolution.storeSku+' · material '+money(resolution.materialTotal)+'. '+(S.spot?'Hole spotting capability remains unresolved. ':'Square crosscut demand is represented. ')+'Processing / fulfillment recovery is not established, so no complete price is shown. Nothing is ordered.'
        :'Store Zero material resolution remains '+((resolution&&resolution.code)||'UNRESOLVED')+'. Nothing is ordered.');
    h+='<section class="panel" style="margin-top:14px"><h3>Store answer</h3><p class="storesentence">'+sentence+'</p>'
      +'<details class="fold"><summary>What gets carried forward?</summary><div class="foldbody"><span class="version">'+esc(S.sent.id)+'</span><br><br>'
      +'The Store receives this exact identified definition. It does not redesign it. Finished length and measured hole locations remain project truth. Local machine datum, tool, compensation, readiness and Cycle Start stay with the commissioned cell.<br><br>'
      +'Confirmation is not an order, payment, allocation, production release, machine readiness or Cycle Start.<br><br><b>NO BLOOD ON WOOD.</b></div></details></section>';
    h+=comparisonReceipt();
  }
  h+=researchFold();
  h+='<p class="foot">Parallel prototype. Start Your Own 0.10 is not modified. Path A remains <a class="link" href="stb-start-own-0.10.html">the generic 2×4 floor</a>.</p>';
  $('app').innerHTML=h; bindBench();
}
function bindBench(){
  $('backhome').onclick=function(){S.screen='home';render();window.scrollTo(0,0)};
  document.querySelectorAll('[data-modepick]').forEach(function(b){b.onclick=function(){S.mode=b.dataset.modepick;S.sent=null;renderBench()}});
  document.querySelectorAll('[data-qtyquick]').forEach(function(b){b.onclick=function(){S.qty=+b.dataset.qtyquick;S.choices.quantity=true;S.sent=null;renderBench()}});
  $('qminus').onclick=function(){S.qty=clamp(S.qty-1,1,8);S.choices.quantity=true;S.sent=null;renderBench()};
  $('qplus').onclick=function(){S.qty=clamp(S.qty+1,1,8);S.choices.quantity=true;S.sent=null;renderBench()};
  document.querySelectorAll('[data-lift]').forEach(function(b){b.onclick=function(){S.length=BASE.length+(+b.dataset.lift);S.choices.length=Math.abs(S.length-BASE.length)>.00001;S.sent=null;renderBench()}});
  function bindInput(id,key){var el=$(id); if(!el)return; el.onchange=el.onblur=function(){var v=parseInch(el.value); if(isFinite(v)){S[key]=v;if(key==='length')S.choices.length=Math.abs(v-BASE.length)>.00001;S.sent=null;renderBench()}else el.value=fmt(S[key])}; el.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();el.blur()}}}
  bindInput('length','length'); bindInput('h1','h1'); bindInput('h2','h2');
  if($('lengthSlider'))$('lengthSlider').oninput=function(){S.length=+this.value;S.choices.length=Math.abs(S.length-BASE.length)>.00001;S.sent=null;renderBench()};
  if($('h1Slider'))$('h1Slider').oninput=function(){S.h1=+this.value;S.sent=null;renderBench()};
  if($('h2Slider'))$('h2Slider').oninput=function(){S.h2=+this.value;S.sent=null;renderBench()};
  $('spotOn').onclick=function(){S.spot=true;S.choices.spots=true; if(S.h1==null)S.h1=BASE.h1; if(S.h2==null)S.h2=BASE.h2; S.sent=null; renderBench()};
  $('spotOff').onclick=function(){S.spot=false;S.choices.spots=true;S.sent=null;renderBench()};
  if($('send'))$('send').onclick=function(){
    if(validate().length||!S.choices.quantity||!S.choices.spots)return;
    var decisions=explicitDecisionList(), handoff=buildOutdoorHandoff(), materialResolution=outdoorMaterialResolution(), storeAnswer=outdoorStoreAnswer();
    S.sent={
      id:versionId(),
      definition:JSON.parse(JSON.stringify(definition())),
      metrics:{explicitProjectDecisions:decisions,explicitProjectDecisionCount:decisions.length,uiActions:METRICS.uiActions},
      storeHandoff:handoff,
      materialResolution:materialResolution,
      storeAnswer:storeAnswer
    };
    try{localStorage.setItem('stb-proof-ladder-job2',JSON.stringify({measured:true,metrics:S.sent.metrics,semanticOutput:normalizedCore(S.sent.definition)}))}catch(_){}
    if(handoff && window.self!==window.top){
      window.parent.postMessage({type:'STB_RECOVERY_STORE_HANDOFF',source:'outdoor',handoff:handoff,answer:storeAnswer},location.origin);
    }
    renderBench();
  };
  };
}
function render(){ if(S.screen==='aframe')renderAframe(); else if(S.screen==='bench')renderBench(); else renderHome(); }
document.addEventListener('click',function(event){
  if(event.target&&event.target.closest&&event.target.closest('button,a'))METRICS.uiActions+=1;
},true);
document.addEventListener('change',function(event){
  if(event.target&&event.target.matches&&event.target.matches('input,select,textarea'))METRICS.uiActions+=1;
},true);
render();
</script>
