<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan-to-Build — System Build</title>
<meta name="stb-canonical-build" content="front-door-0.8">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf9f7}
#stb-current{display:block;width:100%;height:100%;border:0;background:#faf9f7}
</style>
</head>
<body>
<iframe id="stb-current" title="Scan-to-Build System" src="system-build-front-door-0.5.html?v=restore-next"></iframe>
<script>
(() => {
  const shell = document.getElementById('stb-current');
  const addDoorNext = () => {
    const inner = shell.contentDocument && shell.contentDocument.getElementById('stb-current');
    const win = inner && inner.contentWindow;
    const doc = win && win.document;
    if (!doc || typeof win.show !== 'function') return false;
    if (doc.documentElement.dataset.doorNext === 'true') return true;
    ['new-user', 'returning', 'professional'].forEach((id) => {
      const main = doc.querySelector('#' + id + ' .main');
      if (!main || main.querySelector('[data-door-next]')) return;
      const row = doc.createElement('div');
      row.className = 'btns';
      row.innerHTML = '<button type="button" data-door-next="projects">NEXT</button>';
      main.append(row);
    });
    doc.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-door-next]');
      if (!btn) return;
      e.preventDefault();
      win.show(btn.getAttribute('data-door-next'));
    });
    const select = doc.getElementById('canonical-demo-user');
    if (select) {
      [...select.options].forEach((opt) => {
        if (opt.textContent === 'Sarah') opt.textContent = 'User 1';
        if (/^(Tom|Dick|Harry)$/.test(opt.textContent)) opt.remove();
      });
    }
    doc.documentElement.dataset.doorNext = 'true';
    return true;
  };
  const tick = () => {
    let n = 0;
    const t = setInterval(() => {
      n += 1;
      try { if (addDoorNext() || n > 200) clearInterval(t); } catch (e) { if (n > 200) clearInterval(t); }
    }, 50);
  };
  shell.addEventListener('load', tick);
  if (shell.contentDocument && shell.contentDocument.readyState === 'complete') tick();
})();
</script>
</body>
</html>
