<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan-to-Build — System Build</title>
<meta name="stb-canonical-build" content="front-door-0.8">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf9f7}
#stb-current{display:block;width:100%;height:100%;border:0;background:#faf9f7}
</style>
</head>
<body>
<iframe id="stb-current" title="Scan-to-Build System" src="system-build-front-door-0.5.html?v=user1-next-3"></iframe>
<script>
(() => {
  const shell = document.getElementById('stb-current');
  const innerDoc = () => {
    const inner = shell.contentDocument && shell.contentDocument.getElementById('stb-current');
    return inner && inner.contentWindow;
  };
  const clean = () => {
    const win = innerDoc();
    const doc = win && win.document;
    if (!doc || typeof win.show !== 'function') return false;
    try {
      sessionStorage.removeItem('stb-account-session-v1');
      localStorage.removeItem('stb-canonical-saved-projects-v1');
    } catch (e) {}
    doc.querySelectorAll('.demo-active-account,#demo-empty-projects,.demo-empty-projects,.demo-account-gate,.canonical-user-label,#canonical-demo-user,[data-canonical-home-return],[data-demo-account]').forEach((node) => node.remove());
    ['new-user', 'returning', 'professional'].forEach((id) => {
      const page = doc.getElementById(id);
      if (!page) return;
      if (page.querySelector('[data-door-next]')) return;
      const row = page.querySelector('.main .btns');
      const btn = doc.createElement('button');
      btn.type = 'button';
      btn.setAttribute('data-door-next', 'projects');
      btn.textContent = 'NEXT';
      if (row) row.append(btn);
      else {
        const wrap = doc.createElement('div');
        wrap.className = 'btns';
        wrap.append(btn);
        page.querySelector('.main').append(wrap);
      }
    });
    if (!doc.documentElement.dataset.doorNextClick) {
      doc.documentElement.dataset.doorNextClick = 'true';
      doc.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-door-next]');
        if (!btn) return;
        e.preventDefault();
        win.show('projects');
      });
    }
    return true;
  };
  const tick = () => {
    let n = 0;
    const t = setInterval(() => {
      n += 1;
      try { clean(); } catch (e) {}
      if (n > 400) clearInterval(t);
    }, 40);
  };
  shell.addEventListener('load', tick);
  if (shell.contentDocument && shell.contentDocument.readyState === 'complete') tick();
})();
</script>
</body>
</html>
