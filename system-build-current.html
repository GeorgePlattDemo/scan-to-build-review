<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan-to-Build — System Build</title>
<meta name="stb-canonical-build" content="front-door-0.8">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf9f7}
#stb-current{display:block;width:100%;height:100%;border:0;background:#faf9f7}
</style>
</head>
<body>
<iframe id="stb-current" title="Scan-to-Build System" src="system-build-front-door-0.5.html?v=5ac9677b"></iframe>
<script src="stb-canonical-journey.js?v=e0619841"></script>
<script src="store-zero-canonical-doctrine.js?v=65366367"></script>
<script>
(() => {
  const shell = document.getElementById('stb-current');
  const apply = () => {
    const shellWin = shell.contentWindow;
    const shellDoc = shellWin?.document;
    const inner = shellDoc?.getElementById('stb-current');
    if (!inner) return false;
    const win = inner.contentWindow;
    const doc = win?.document;
    if (!doc || typeof win.show !== 'function' || !doc.getElementById('playhouse-record')) return false;
    if (doc.documentElement.dataset.s001OutcomeSplit === 'true') return true;
    doc.documentElement.dataset.s001OutcomeSplit = 'true';

    const style = doc.createElement('style');
    style.textContent = `
      .window-seat-shell-page{padding:0!important;overflow:hidden;background:var(--surface)}
      .window-seat-shell-page.on{display:block!important}
      .window-seat-shell-main{width:100%;min-width:0;background:var(--surface)}
      .window-seat-shell-frame{display:block;width:100%;height:calc(100vh - 76px);min-height:680px;border:0;background:var(--bg)}
      .start-own-shell-page{padding:0!important;overflow:hidden;background:var(--surface)}
      .start-own-shell-page.on{display:block!important}
      .start-own-shell-main{width:100%;min-width:0;background:var(--surface)}
      .start-own-shell-frame{display:block;width:100%;height:calc(100vh - 76px);min-height:680px;border:0;background:var(--bg)}
      .outdoor-build-shell-page{padding:0!important;overflow:hidden;background:var(--surface)}
      .outdoor-build-shell-page.on{display:block!important}
      .outdoor-build-shell-main{width:100%;min-width:0;background:var(--surface)}
      .outdoor-build-shell-frame{display:block;width:100%;height:calc(100vh - 76px);min-height:680px;border:0;background:var(--bg)}
      .proof-shell-return{display:block;margin:8px 14px;padding:6px 0;border:0;background:transparent;color:var(--text2);font-size:11px;font-weight:700;cursor:pointer}
      .proof-actor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:12px 0}
      .proof-actor-grid>div{border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--surface)}
      .proof-actor-grid b,.proof-actor-grid span{display:block}.proof-actor-grid b{font-size:9px;letter-spacing:.06em;color:var(--text2)}.proof-actor-grid span{margin-top:4px;font-size:12px}
      .proof-gap{margin:12px 0;padding:12px 14px;border-left:4px solid #9b7540;background:var(--tint);font-size:12px;line-height:1.55}
      .proof-gap b{display:block;margin-bottom:4px}
      .proof-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.proof-nav button{font:inherit;font-size:11px;padding:7px 11px;border:1px solid var(--border);border-radius:7px;background:var(--surface);cursor:pointer}.proof-nav .next{margin-left:auto;color:var(--accent);font-weight:700}
      .s001-v2-intent-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(300px,1.1fr);gap:16px;align-items:start;margin:14px 0}
      .s001-v2-story{font-size:13px;line-height:1.55;margin:10px 0 0}
      .s001-v2-callout{margin:12px 0;padding:12px 14px;border-left:4px solid var(--accent);background:var(--tint);font-size:13px;line-height:1.5}
      .s001-v2-callout b{display:block;margin-bottom:3px}
      .s001-v2-machine-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:16px;align-items:start;margin:14px 0}
      .s001-v2-sheet{width:100%;height:auto;display:block;background:#f4efe7;border-radius:9px;border:1px solid var(--border)}
      .s001-v2-legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:9px 0 0;font-size:10.5px;color:var(--text2)}
      .s001-v2-legend span{display:flex;align-items:center;gap:6px}
      .s001-v2-key{width:24px;height:0;border-top:3px solid #3f3a34;display:inline-block}
      .s001-v2-key.tabs{border-top-style:dotted;border-top-width:5px;border-color:#7a5b2f}
      .s001-v2-key.saw{border-top-style:dashed;border-color:#315f85}
      .s001-v2-key.out{height:9px;border:0;background:rgba(176,55,52,.18);outline:1px solid rgba(176,55,52,.55)}
      .s001-v2-seq{display:grid;gap:7px;margin:12px 0}
      .s001-v2-seq .row{display:grid;grid-template-columns:28px 1fr;gap:9px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
      .s001-v2-seq .n{font-size:10px;font-weight:800;color:var(--accent)}
      .s001-v2-seq b,.s001-v2-seq span{display:block}
      .s001-v2-seq b{font-size:11px}.s001-v2-seq span{margin-top:2px;font-size:10.5px;color:var(--text2);line-height:1.35}
      .s001-v2-store-split{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:9px;margin:12px 0}
      .s001-v2-store-card{border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:11px}
      .s001-v2-store-card h3{margin:0 0 7px;font-size:12px}.s001-v2-store-card p{margin:5px 0;font-size:11px;line-height:1.45}
      .s001-v2-pass{border-left:4px solid #557b58}.s001-v2-separate{border-left:4px solid #9b7540}
      .s001-v2-order{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px;margin:12px 0}
      .s001-v2-order>div{border:1px solid var(--border);border-radius:8px;padding:9px;background:var(--surface)}
      .s001-v2-order b,.s001-v2-order span{display:block}.s001-v2-order b{font-size:9px;letter-spacing:.05em;color:var(--text2)}.s001-v2-order span{margin-top:3px;font-size:11.5px}
      .seat-guided-stage .stage-tag{margin:0 0 5px;font-size:9px;font-weight:700;letter-spacing:.09em;color:var(--accent)}
      .seat-guided-stage .lede{margin:0 0 10px;font-size:13.5px;color:var(--text2);line-height:1.55}
      .seat-guided-stage .ws-journey-section{padding:13px 0;border-top:1px solid var(--border)}
      .seat-guided-stage .ws-journey-section:first-of-type{border-top:0}
      .seat-guided-stage .ws-journey-section h2{font-size:15px;margin:0 0 6px}
      .seat-guided-stage .ws-journey-section p{margin:0 0 7px;line-height:1.5}
      .seat-guided-stage .ws-journey-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:10px 0}
      .seat-guided-stage .ws-journey-grid .kv{display:block;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:8px 10px}
      .seat-guided-stage .ws-journey-grid .kv span{display:block}
      .seat-guided-stage .ws-journey-grid .kv span:first-child{font-size:9px;font-weight:700;letter-spacing:.05em;color:var(--text2)}
      .seat-guided-stage .ws-journey-grid .kv span:last-child{margin-top:3px;font-size:11.5px;color:var(--text)}
      .seat-guided-stage .ws-journey-callout{margin:11px 0;padding:10px 12px;border-left:3px solid var(--border-accent);background:var(--surface);font-size:12px;line-height:1.5}
      .seat-guided-stage .ws-journey-callout.warn{border-left-color:#9b7540}
      .seat-guided-stage .ws-journey-flow{font:11px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text2)}
      .seat-guided-stage .stage-bottom{display:flex;align-items:center;gap:8px;margin-top:18px;padding-top:12px;border-top:1px solid var(--border)}
      .seat-guided-stage .stage-bottom button{font:inherit;font-size:11px;padding:6px 11px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
      .seat-guided-stage .stage-bottom .next{margin-left:auto;border:0;background:transparent;color:var(--accent);font-weight:650}
      .seat-guided-stage .stage-fine{font-size:9.5px;color:var(--text2)}
      .seat-guided-stage .s{padding:13px 0;border-top:1px solid var(--border)}
      .seat-guided-stage .s .h{display:flex;gap:9px;align-items:baseline;margin-bottom:5px;flex-wrap:wrap}
      .seat-guided-stage .s .num{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--text2)}
      .seat-guided-stage .s .name{font-size:13.5px;font-weight:600}
      .seat-guided-stage .s .st{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:3px;background:var(--surface);color:var(--text2);border:1px solid var(--border)}
      .seat-guided-stage .s p{margin:0 0 7px;color:var(--text2)}
      .seat-guided-stage .s p.q{font-size:12px;padding-left:11px;border-left:2px solid var(--border-accent)}
      .seat-guided-stage .ops{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:11px 0 3px}
      .seat-guided-stage .ops .t{margin:0 0 7px;font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
      .seat-guided-stage .ops .chain{font:11.5px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text2);margin:0 0 8px}
      .seat-guided-stage .close{border-top:1px solid var(--border-accent);margin-top:16px;padding-top:14px}
      .seat-guided-stage .close p{margin:0 0 9px;color:var(--text2)}
      @media(max-width:820px){.s001-v2-intent-grid,.s001-v2-machine-grid{grid-template-columns:1fr}.seat-guided-stage .ws-journey-grid{grid-template-columns:1fr}}
    `;
    doc.head.append(style);

    let activeJourneyProject = null;
    let seatJourneySnapshot = null;
    let proofHandoff = null;
    let captureStartOwnProof = () => {};
    let pendingSeatView = {mode:'continuous',stage:null};

    const home = doc.getElementById('projects');
    if (home) {
      home.querySelector('[data-canonical-home-return]')?.remove();

      const ribbon = home.querySelector(':scope > .split > .ribbon');
      if (ribbon) {
        ['start-own','picnic-chooser','alcove-capture','window-intake','window-parts'].forEach(id => {
          const tile = ribbon.querySelector(`.tile[data-go="${id}"]`);
          if (tile) ribbon.append(tile);
        });

        const proofLabels = Object.freeze([
          ['start-own','TEST 01 · FROM A BOARD'],
          ['picnic-chooser','TEST 02 · FROM A BOUNDED PROJECT'],
          ['alcove-capture','TEST 03 · FIT THE SPACE'],
          ['window-intake','TEST 04 · DEFINE THE ASSEMBLY'],
          ['window-parts','TEST 05 · CHANGE THE MATERIAL STREAM']
        ]);
        proofLabels.forEach(([id,label]) => {
          const tile = ribbon.querySelector(`.tile[data-go="${id}"]`);
          if (!tile || tile.querySelector('[data-proof-test]')) return;
          const marker = doc.createElement('span');
          marker.dataset.proofTest = id;
          marker.textContent = label;
          marker.style.cssText = 'display:block;margin:0 0 4px;font-size:8px;line-height:1.2;font-weight:700;letter-spacing:.04em;color:var(--text3)';
          tile.prepend(marker);
        });

        const startOwnTile = ribbon.querySelector('.tile[data-go="start-own"]');
        if (startOwnTile) {
          startOwnTile.removeAttribute('data-go');
          startOwnTile.dataset.startOwnArtifact = 'stb-start-own-0.11.html';
          startOwnTile.title = 'Start Your Own · generic operation candidate · 0.11';

          let startOwnPage = doc.getElementById('start-own-live');
          if (!startOwnPage) {
            startOwnPage = doc.createElement('section');
            startOwnPage.className = 'page start-own-shell-page';
            startOwnPage.id = 'start-own-live';
            startOwnPage.innerHTML = `
              <div class="start-own-shell-main">
                <div data-proof-job="1" style="margin:0 0 12px;padding:14px 16px;border:1px solid var(--border);border-radius:9px;background:var(--surface)">
                  <p style="margin:0 0 5px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text3)">TEST 01 · FROM A BOARD</p>
                  <p style="margin:0 0 8px"><b>TARGET: Define the Sawhorse Bench comparison member yourself.</b></p>
                  <p class="dim" style="margin:0 0 8px">Target requirement: <b style="color:var(--text)">2×4 · 15½ in · quantity 8 · 10° source-stated DOUBLE BEVEL · both ends · parallel · source cut-list length datum.</b></p>
                  <p class="dim" style="margin:0 0 6px">Quantity 8 is <b style="color:var(--text)">project composition</b>: two separate bench assemblies × four published end-leg occurrences per bench. It is not presented as one published eight-leg bench.</p>
                  <p class="dim" style="margin:0">Use the generic floor below. Pick the board, define the straight length, add the angled cut, and state what the angle means. Nothing is prefilled for you by the proof wrapper.</p>
                  <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--text2)">
                    <span>Explicit project decisions: <b id="proof-job1-decisions">0</b></span>
                    <span>UI actions: <b id="proof-job1-actions">0</b></span>
                    <span id="proof-job1-match">Target not yet represented.</span>
                  </div>
                  <button type="button" id="proof-job1-back" style="margin-top:10px">← PROJECT LIBRARY</button>
                </div>
                <iframe
                  id="start-own-proof-frame"
                  class="start-own-shell-frame"
                  title="Start Your Own · definition to doing"
                  src="stb-start-own-0.11.html?v=01bc520c"
                ></iframe>
              </div>
            `;
            doc.querySelector('.wrap')?.append(startOwnPage);
          }

          const proofFrame = startOwnPage.querySelector('#start-own-proof-frame');
          const proofDecisions = new Set();
          let proofActions = 0;
          const classifyStartOwnDecision = target => {
            const choice = target?.closest?.('[data-grade],[data-size],[data-maker],[data-step],[data-set],[data-exact],[data-op-toggle],[data-op-set],[data-op-angle]');
            if (!choice) return;
            if (choice.dataset.grade) proofDecisions.add('material_family');
            if (choice.dataset.size) proofDecisions.add('stock_class');
            if (choice.dataset.maker) proofDecisions.add('part_form');
            if (choice.dataset.opToggle === 'angled') proofDecisions.add('angled_cut');
            if (choice.dataset.opAngle != null) proofDecisions.add('angle_degrees');
            if (choice.dataset.opSet) {
              const field = choice.dataset.opSet.split(':')[0];
              const names = {angleReference:'angle_reference',cutPlane:'cut_plane',endIdentity:'end_identity',endRelation:'end_relation',lengthDatum:'length_datum'};
              if (names[field]) proofDecisions.add(names[field]);
            }
            const path = choice.dataset.exact
              || (choice.dataset.step ? choice.dataset.step.split(':')[0] : '')
              || (choice.dataset.set ? choice.dataset.set.split(':')[0] : '');
            if (path === 'cuts.0.len') proofDecisions.add('finished_length');
            if (path === 'cuts.0.qty') proofDecisions.add('quantity');
          };
          captureStartOwnProof = () => {
            const state = proofFrame?.contentWindow?.S;
            if (!state) return;
            let semanticOutput = null;
            if (state.maker === 'cuts' && state.cuts?.pieces?.length === 1 && state.cutOps?.angled) {
              const part = state.cuts.pieces[0];
              semanticOutput = {
                stockClass: state.size === '2x4' ? '2x4' : state.size,
                finishedLength: Number(part.len),
                quantity: Number(part.qty),
                endCondition: 'angled',
                straightCut: true,
                angleDegrees: Number(state.cutOps.angle),
                angleReference: state.cutOps.angleReference,
                cutPlane: state.cutOps.cutPlane,
                endIdentity: state.cutOps.endIdentity,
                endRelation: state.cutOps.endRelation,
                lengthDatum: state.cutOps.lengthDatum,
                sourcePart: 'ANA-WHITE-SAW-HORSE-BENCH/END-LEG'
              };
            }
            const targetMatch = !!semanticOutput
              && semanticOutput.stockClass === '2x4'
              && Math.abs(semanticOutput.finishedLength - 15.5) < 0.00001
              && semanticOutput.quantity === 8
              && semanticOutput.endCondition === 'angled'
              && semanticOutput.angleDegrees === 10
              && semanticOutput.angleReference === 'source-stated'
              && semanticOutput.cutPlane === 'bevel-thickness'
              && semanticOutput.endIdentity === 'both'
              && semanticOutput.endRelation === 'parallel'
              && semanticOutput.lengthDatum === 'source-length';
            const payload = {
              measured: true,
              explicitProjectDecisions: [...proofDecisions],
              explicitProjectDecisionCount: proofDecisions.size,
              uiActions: proofActions,
              semanticOutput,
              targetMatch
            };
            try { win.localStorage.setItem('stb-proof-ladder-job1', JSON.stringify(payload)); } catch (_) {}
            const d = startOwnPage.querySelector('#proof-job1-decisions');
            const a = startOwnPage.querySelector('#proof-job1-actions');
            const m = startOwnPage.querySelector('#proof-job1-match');
            if (d) d.textContent = String(payload.explicitProjectDecisionCount);
            if (a) a.textContent = String(payload.uiActions);
            if (m) m.textContent = targetMatch ? 'Core target represented.' : 'Target not yet represented.';
          };
          if (proofFrame && !proofFrame.dataset.proofObserved) {
            proofFrame.dataset.proofObserved = 'true';
            proofFrame.addEventListener('load', () => {
              const childDoc = proofFrame.contentDocument;
              if (!childDoc) return;
              childDoc.addEventListener('click', event => {
                const target = event.target?.closest?.('button,a');
                if (!target) return;
                proofActions += 1;
                classifyStartOwnDecision(target);
                win.setTimeout(captureStartOwnProof, 0);
              }, true);
              childDoc.addEventListener('change', event => {
                const target = event.target?.closest?.('[data-exact],[data-op-angle]');
                if (!target) return;
                proofActions += 1;
                classifyStartOwnDecision(target);
                win.setTimeout(captureStartOwnProof, 0);
              }, true);
              captureStartOwnProof();
            });
          }
          startOwnPage.querySelector('#proof-job1-back')?.addEventListener('click', () => {
            selectJourneyProject(null);
            originalShow.call(win, 'projects');
          });

          startOwnTile.addEventListener('click', event => {
            event.preventDefault();
            event.stopImmediatePropagation();
            selectJourneyProject(null);
            originalShow.call(win, 'start-own-live');
          }, true);
        }

        const outdoorTile = ribbon.querySelector('.tile[data-go="picnic-chooser"]');
        if (outdoorTile) {
          outdoorTile.removeAttribute('data-go');
          outdoorTile.dataset.outdoorBuildArtifact = 'stb-outdoor-build.html';
          outdoorTile.title = 'Outdoor Build · matching Sawhorse table + two benches';

          let outdoorPage = doc.getElementById('outdoor-build-live');
          if (!outdoorPage) {
            outdoorPage = doc.createElement('section');
            outdoorPage.className = 'page outdoor-build-shell-page';
            outdoorPage.id = 'outdoor-build-live';
            outdoorPage.innerHTML = `
              <div class="outdoor-build-shell-main">
                <iframe
                  class="outdoor-build-shell-frame"
                  title="Outdoor Build · Sawhorse table + matching benches"
                  src="stb-outdoor-build.html?v=5279d330"
                ></iframe>
              </div>
            `;
            doc.querySelector('.wrap')?.append(outdoorPage);
          }

          outdoorTile.addEventListener('click', event => {
            event.preventDefault();
            event.stopImmediatePropagation();
            selectJourneyProject(null);
            originalShow.call(win, 'outdoor-build-live');
          }, true);
        }

        const windowSeatTile = ribbon.querySelector('.tile[data-go="window-intake"]');
        if (windowSeatTile) {
          windowSeatTile.removeAttribute('data-go');
          windowSeatTile.dataset.windowSeatArtifact = 'stb-window-seat-space-utilization-0.7.4.html';
          windowSeatTile.title = 'Space utilization · Window seat · live 0.7.4';

          let windowSeatPage = doc.getElementById('window-seat-live');
          if (!windowSeatPage) {
            windowSeatPage = doc.createElement('section');
            windowSeatPage.className = 'page window-seat-shell-page';
            windowSeatPage.id = 'window-seat-live';
            windowSeatPage.innerHTML = `
              <div class="window-seat-shell-main">
                <button type="button" class="proof-shell-return" data-proof-library>← PROJECT LIBRARY</button>
                <iframe
                  class="window-seat-shell-frame"
                  title="Space utilization · Window seat"
                  src="stb-window-seat-space-utilization-0.7.4.html?v=96c85fee"
                ></iframe>
              </div>
            `;
            doc.querySelector('.wrap')?.append(windowSeatPage);
          }

          windowSeatTile.addEventListener('click', event => {
            event.preventDefault();
            event.stopImmediatePropagation();
            selectJourneyProject('window-seat');
            showSeatContinuous();
          }, true);
        }
      }

      if (!win.__stbProofLadderMessageBound) {
        win.__stbProofLadderMessageBound = true;
        win.addEventListener('message', event => {
          if (event.origin !== win.location.origin) return;
          const type = event.data?.type;
          if (type === 'STB_PROOF_RETURN_LIBRARY') {
            selectJourneyProject(null);
            originalShow.call(win, 'projects');
          } else if (type === 'STB_PROOF_OPEN_JOB1') {
            selectJourneyProject(null);
            originalShow.call(win, 'start-own-live');
          } else if (type === 'STB_START_OWN_CONFIRMED' && event.data?.payload) {
            captureStartOwnProof();
            proofHandoff = {job:'JOB 1 · START YOUR OWN',source:'start-own',payload:event.data.payload};
            try { win.localStorage.setItem('stb-proof-handoff-job1', JSON.stringify(proofHandoff)); } catch (_) {}
            syncProofHandoff();
            originalShow.call(win, 'proof-store');
          } else if (type === 'STB_OUTDOOR_CONFIRMED' && event.data?.payload) {
            proofHandoff = {job:'JOB 2 · OUTDOOR BUILD',source:'outdoor',payload:event.data.payload};
            try { win.localStorage.setItem('stb-proof-handoff-job2', JSON.stringify(proofHandoff)); } catch (_) {}
            syncProofHandoff();
            originalShow.call(win, 'proof-store');
          }
        });
      }

      const body = home.querySelector(':scope > .split > .body');
      if (body) {
        [...body.children].forEach(node => {
          if (!node.classList.contains('backbar')) node.remove();
        });
        body.insertAdjacentHTML('beforeend', `
          <h1 style="font-size:21px">What are you making?</h1>
          <p><b>A bounded project starts with work that has already been mapped.</b> <span class="dim">The parts, their relationships, and the questions that must be answered are defined before you get here. Anything that still needs engineering, Store resolution, or physical verification stays visible.</span></p>
          <p class="dim">What's left is the part only you can answer: <b style="color:var(--text)">your space, your measurements, and the choices that make this one yours.</b></p>
          <p class="dim">You should not be asked to solve the project for us. <b style="color:var(--text)">A question appears only when your answer changes the definition.</b></p>
          <p><b>That's why the list is worth a look first.</b> <span class="dim">When a bounded project fits what you want to make, you skip the questions that do not belong to you.</span></p>
          <h3>Some answers open more questions</h3>

          if (yardButton) yardButton.textContent = 'Store / Yard';
          if (recordButton) recordButton.textContent = 'Handoff / Record';
        } else if (activeJourneyProject === 'window-seat') {
          ['alcove-review','terms','recap'].forEach(target => {
            const button = nav.querySelector('button[data-go="'+target+'"]');
            if (button) button.hidden = true;
          });
          const storeButton = nav.querySelector('button[data-go="store"]');
          const requestButton = nav.querySelector('button[data-go="request"]');
          const yardButton = nav.querySelector('button[data-go="yard"]');
          const recordButton = nav.querySelector('button[data-go="record"]');
          if (storeButton) storeButton.textContent = 'Store Answer';
          if (requestButton) requestButton.textContent = 'Accept / Pay';
          if (yardButton) yardButton.textContent = 'Store / Yard';
          if (recordButton) recordButton.textContent = 'Handoff / Record';
        }
      }
    }

    function seatFrame() {
      return doc.querySelector('#window-seat-live .window-seat-shell-frame');
    }

    function cloneSeat(value) {
      return value == null ? value : JSON.parse(JSON.stringify(value));
    }

    function refreshSeatSnapshot(evaluate, supplied) {
      if (supplied) seatJourneySnapshot = cloneSeat(supplied);
      const bridge = seatFrame()?.contentWindow?.STBWindowSeatJourney;
      if (bridge) {
        try { seatJourneySnapshot = cloneSeat(evaluate ? bridge.evaluateCurrent() : bridge.snapshot()); } catch {}
      }
      return seatJourneySnapshot;
    }

    function annotateJourneyNav() {
      doc.querySelectorAll('.recovery-nav button').forEach(function(button) {
        const target = button.getAttribute('data-go') || button.getAttribute('data-canonical-go');
        const stage = LEGACY_TARGET_TO_STAGE[target] || null;
        if (stage) button.dataset.journeyStage = stage;
      });
    }

    function syncSeatNav(stage) {
      doc.querySelectorAll('.recovery-nav button').forEach(function(button) {
        if (stage && button.dataset.journeyStage === stage) button.setAttribute('aria-current', 'step');
        else button.removeAttribute('aria-current');
      });
    }

    function applyPendingSeatView() {
      const bridge = seatFrame()?.contentWindow?.STBWindowSeatJourney;
      if (!bridge) return false;
      try {
        if (pendingSeatView.mode === 'guided') bridge.showGuided(WINDOW_SEAT_STAGE_TO_ACTOR[pendingSeatView.stage || 'scan'] || 'scan');
        else bridge.showContinuous();
        refreshSeatSnapshot(false);
        return true;
      } catch {
        return false;
      }
    }

    function openSeatView(mode, stage) {
      if (activeJourneyProject !== 'window-seat') return false;
      if (!canonicalJourneyReady()) return false;
      if (mode === 'guided' && canonicalJourney.stages.indexOf(stage || 'scan') < 0) return false;
      pendingSeatView = {mode: mode, stage: stage || null};
      originalShow.call(win, 'window-seat-live');
      if (!applyPendingSeatView()) setTimeout(applyPendingSeatView, 0);
      if (mode === 'guided') syncSeatNav(stage || 'scan');
      else syncSeatNav(null);
      return true;
    }

    function showSeatContinuous() {
      return openSeatView('continuous', null);
    }

    function showSeatGuided(stage, supplied) {
      if (activeJourneyProject !== 'window-seat') return false;
      if (supplied) refreshSeatSnapshot(false, supplied);
      return openSeatView('guided', stage);
    }

    function showMappedProjectStage(projectId, stage) {
      if (projectId === 'alcove') {
        const customerStage = {
          scan:'scan',
          configure:'configure',
          store:'store',
          review:'store',
          request:'request',
          yard:'yard',
          terms:'yard',
          recap:'record',
          record:'record'
        }[stage] || null;
        const target = customerStage ? PROJECT_STAGE_TARGETS.alcove[customerStage] : null;
        if (!target || !doc.getElementById(target)) return false;
        originalShow.call(win, target);
        setTimeout(syncAlcoveCommercialSurface,0);
        return true;
      }
      if (projectId === 'picnic' && ['yard','terms','recap','record'].includes(stage)) {
        originalShow.call(win, 'picnic-request');
        if (typeof syncPicnicJourney === 'function') setTimeout(syncPicnicJourney, 0);
        return true;
      }
      const target = PROJECT_STAGE_TARGETS[projectId]?.[stage] || null;
      if (!target || !doc.getElementById(target)) return false;
      originalShow.call(win, target);
      if (projectId === 'playhouse') setTimeout(sync, 0);
      if (projectId === 'picnic' && typeof syncPicnicJourney === 'function') setTimeout(syncPicnicJourney, 0);
      return true;
    }

    seatFrame()?.addEventListener('load', () => {
      setTimeout(applyPendingSeatView, 0);
    });
    applyPendingSeatView();

    window.addEventListener('message', function(event) {
      if (event.origin !== window.location.origin) return;
      if (event.source !== seatFrame()?.contentWindow) return;
      if (activeJourneyProject !== 'window-seat') return;
      if (event.data?.type === 'stb-window-seat-guided-handoff') {
        showSeatGuided(event.data.stage || 'store', event.data.snapshot || null);
        return;
      }
      if (event.data?.type === 'stb-window-seat-guided-stage') {
        showSeatGuided(event.data.stage, event.data.snapshot || null);
      }
    });

    const PROJECT_TILE_TO_JOURNEY = Object.freeze({
      'alcove-capture': 'alcove',
      'window-parts': 'playhouse',
      'picnic-chooser': 'picnic'
    });

    win.addEventListener('click', function(event) {
      if (activeJourneyProject !== 'alcove') return;
      const go = event.target.closest?.('[data-go]');
      if (!go) return;
      const target = go.getAttribute('data-go');
      const map = {
        'alcove-review':'store',
        'request':'request',
        'terms':'yard',
        'recap':'record'
      };
      const destination = map[target] || null;
      if (!destination) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      originalShow.call(win,destination);
      setTimeout(syncAlcoveCommercialSurface,0);
    }, true);

    win.addEventListener('click', function(event) {
      const navButton = event.target.closest?.('.recovery-nav button[data-journey-stage]');
      if (!navButton || !activeJourneyProject) return;
      const stage = navButton.dataset.journeyStage;
      if (!stage) return;
      if (activeJourneyProject === 'window-seat') {
        event.preventDefault();
        event.stopImmediatePropagation();
        showSeatGuided(stage);
        return;
      }
      if (showMappedProjectStage(activeJourneyProject, stage)) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);

    win.addEventListener('click', function(event) {
      if (activeJourneyProject === 'picnic' && event.target.closest?.('#confirm-picnic')) {
        event.preventDefault();
        event.stopImmediatePropagation();
        doc.documentElement.dataset.picnicRevisionConfirmed = 'true';
        originalShow.call(win, 'picnic-request');
        setTimeout(syncPicnicJourney, 0);
        return;
      }
      if (activeJourneyProject === 'playhouse' && event.target.closest?.('#playhouse-review [data-canonical-go="playhouse-request"]')) {
        doc.documentElement.dataset.playhouseRevisionConfirmed = 'true';
      }
    }, true);

    // Project identity is selected at the window-capture boundary so it runs
    // before the older front-door preview handler can stop propagation.
    // A route or stage change never selects a project implicitly.
    win.addEventListener('click', function(event) {
      const tile = event.target.closest?.('#projects .tile[data-go]');
      if (!tile) return;
      const target = tile.getAttribute('data-go');
      if (target === 'start-own') {
        selectJourneyProject(null);
        return;
      }
      selectJourneyProject(PROJECT_TILE_TO_JOURNEY[target] || null);
    }, true);

    win.show = function(id) {
      const target = String(id);
      const stage = LEGACY_TARGET_TO_STAGE[target] || null;
      if (activeJourneyProject === 'window-seat') {
        if (stage) { showSeatGuided(stage); return; }
        if (target === 'projects' || target === 'landing' || target === 'my-projects' || target === 'archive') {
          pendingSeatView = {mode:'continuous',stage:null};
        }
      } else if (stage && activeJourneyProject && showMappedProjectStage(activeJourneyProject, stage)) {
        return;
      }
      const result = originalShow.apply(this, arguments);
      if (target.startsWith('playhouse')) setTimeout(sync, 0);
      return result;
    };
    annotateJourneyNav();
    if (!canonicalJourneyReady()) return false;
    doc.documentElement.dataset.canonicalJourneyVersion = canonicalJourney.version;
    return true;
  };

  const scheduleApply = () => {
    let attempts = 0;
    const timer = setInterval(() => {
      attempts += 1;
      try {
        if (apply() || attempts > 200) clearInterval(timer);
      } catch (error) {
        if (attempts > 200) clearInterval(timer);
      }
    }, 50);
  };
  shell.addEventListener('load', scheduleApply);
  if (shell.contentDocument?.readyState === 'complete') scheduleApply();
})();
</script>
</body>
</html>
