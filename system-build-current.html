<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan-to-Build — System Build</title>
<meta name="stb-canonical-build" content="front-door-0.3">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf9f7}
#stb-current{display:block;width:100%;height:100%;border:0;background:#faf9f7}
</style>
</head>
<body>
<iframe id="stb-current" title="Scan-to-Build System" src="system-build-base-8d8a9dd.html"></iframe>
<script>
(() => {
  const frame = document.getElementById('stb-current');
  frame.addEventListener('load', () => {
    const win = frame.contentWindow;
    const doc = win.document;
    const wrap = doc.querySelector('.wrap');
    if (!wrap) return;

    const style = doc.createElement('style');
    style.textContent = `
      .recovery-nav{align-items:center}
      .recovery-nav .canonical-nav-spacer{flex:1}
      .recovery-nav .canonical-user-label{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--text2);font-size:10px;font-weight:600;letter-spacing:.03em}
      .recovery-nav .canonical-user-label select{font:inherit;font-size:10px;padding:4px 7px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text)}
      #projects>.demo-active-account,#projects>#demo-empty-projects{display:none!important}
    `;
    doc.head.append(style);

    const recovery = doc.querySelector('.recovery-nav');
    if (recovery) {
      const homeButton = recovery.querySelector('[data-go="projects"]');
      if (homeButton) homeButton.textContent = 'Home';
      const myProjectsButton = doc.createElement('button');
      myProjectsButton.type = 'button';
      myProjectsButton.textContent = 'My Projects';
      myProjectsButton.setAttribute('data-canonical-go', 'my-projects');
      if (homeButton) homeButton.insertAdjacentElement('afterend', myProjectsButton);

      const spacer = doc.createElement('span');
      spacer.className = 'canonical-nav-spacer';
      recovery.append(spacer);

      const userLabel = doc.createElement('label');
      userLabel.className = 'canonical-user-label';
      userLabel.innerHTML = 'DEMO USER <select id="canonical-demo-user"><option>Sarah</option><option>Tom</option><option>Dick</option><option>Harry</option></select>';
      recovery.append(userLabel);
    }

    function makePage(id, mainHtml, railHtml) {
      const section = doc.createElement('section');
      section.className = 'page';
      section.id = id;
      section.innerHTML = '<div class="main">' + mainHtml + '</div><aside class="rail"><p class="hd">BUILD GUIDE</p>' + railHtml + '</aside>';
      wrap.append(section);
      return section;
    }

    makePage('my-projects',
      '<h1>MY PROJECTS</h1><p class="sub" id="canonical-my-projects-intro"></p><div id="canonical-my-projects-body"></div><div class="btns"><button type="button" data-canonical-go="projects">+ START ANOTHER PROJECT</button><button type="button" data-canonical-go="projects">HOME</button></div>',
      '<p class="goal">Your chute</p><div class="row"><b>Account-scoped</b><span>This is the active user’s own working list, separate from the shared Home library.</span></div><div class="row"><b>Start new at Home</b><span>A new project begins by seeing the bounded-project library first.</span></div>'
    );

    makePage('archive',
      '<h1>COMPLETED PROJECTS / RECORDS</h1><p class="sub" id="canonical-archive-intro"></p><div id="canonical-archive-body"></div><div class="btns"><button type="button" data-canonical-go="my-projects">RETURN TO MY PROJECTS</button><button type="button" data-canonical-go="projects">HOME</button></div>',
      '<p class="goal">Your records</p><div class="row"><b>Account-scoped</b><span>Changing the demo user changes whose private records are shown.</span></div><div class="row"><b>No invented history</b><span>An empty demo account stays empty until a record actually exists.</span></div>'
    );

    const allowed = ['Sarah','Tom','Dick','Harry'];
    let activeUser = 'Sarah';
    const userSelect = doc.getElementById('canonical-demo-user');

    function renderMyProjects() {
      const intro = doc.getElementById('canonical-my-projects-intro');
      const body = doc.getElementById('canonical-my-projects-body');
      if (!intro || !body) return;
      intro.textContent = activeUser.toUpperCase() + ' · previous / working projects';
      if (activeUser === 'Sarah') {
        body.innerHTML = '<p class="dim">Sarah’s current project list is the full project set shown on Home.</p>';
      } else {
        body.innerHTML = '<p><b>' + activeUser.toUpperCase() + '</b> has no previous or saved private projects in this demonstration yet.</p><p class="dim">Use HOME to see the shared bounded-project library before starting something new.</p>';
      }
    }

    function renderArchive() {
      const intro = doc.getElementById('canonical-archive-intro');
      const body = doc.getElementById('canonical-archive-body');
      if (!intro || !body) return;
      intro.textContent = activeUser.toUpperCase() + ' · private demo archive';
      if (activeUser === 'Sarah') {
        body.innerHTML = '<div class="reviewbox"><p style="font-weight:600;margin-bottom:6px">Alcove insert · frozen reference record</p><p class="dim">Open the retained record path for the current bounded-project demonstration.</p><button type="button" data-canonical-go="record">OPEN RECORD</button></div>';
      } else {
        body.innerHTML = '<p><b>' + activeUser.toUpperCase() + '</b> has no completed records in this demonstration.</p><p class="dim">Switching users does not expose Sarah’s private demo record.</p>';
      }
    }

    function keepHomeShared() {
      const projects = doc.getElementById('projects');
      if (!projects) return;
      const split = projects.querySelector(':scope > .split');
      if (split) split.hidden = false;
      const empty = doc.getElementById('demo-empty-projects');
      if (empty) empty.hidden = true;
    }

    function renderAccount(name) {
      if (!allowed.includes(name)) name = 'Sarah';
      activeUser = name;
      if (userSelect) userSelect.value = name;
      keepHomeShared();
      renderMyProjects();
      renderArchive();
    }

    // Sarah is User 1 / the deterministic demonstration default. Home itself is shared.
    renderAccount('Sarah');

    if (userSelect) {
      userSelect.addEventListener('change', () => renderAccount(userSelect.value));
    }

    // The original full project-ribbon screen is Home. The top-left Start your own tile remains the only direct blank-project entry.
    const homeBody = doc.querySelector('#projects .body');
    if (homeBody && !homeBody.querySelector('[data-canonical-home-return]')) {
      const returnRow = doc.createElement('div');
      returnRow.className = 'btns';
      returnRow.setAttribute('data-canonical-home-return', 'true');
      returnRow.innerHTML = '<button type="button" data-canonical-go="my-projects">RETURN TO MY PROJECTS</button>';
      homeBody.prepend(returnRow);
    }

    // Remove only the temporary four-name account-button workaround from the three orientation pages.
    doc.querySelectorAll('#new-user .demo-account-gate,#returning .demo-account-gate,#professional .demo-account-gate').forEach(node => node.remove());

    function wireDoor(pageId, destinations) {
      const buttons = [...doc.querySelectorAll('#' + pageId + ' .door-preview button')];
      buttons.forEach((button, index) => {
        button.disabled = false;
        button.removeAttribute('disabled');
        button.setAttribute('data-canonical-go', destinations[index] || 'projects');
      });
    }

    // Keep every original button label. Every start-new choice sees Home / bounded projects first.
    wireDoor('new-user', ['projects','projects','projects']);
    wireDoor('returning', ['my-projects','projects','archive']);
    wireDoor('professional', ['intake','intake','intake']);

    let currentId = doc.querySelector('.page.on')?.id || 'landing';
    const navStack = [];

    function canonicalShow(requestedId, push = true) {
      let id = requestedId;
      // Sarah’s current Home project set is also her entire My Projects list for now.
      if (id === 'my-projects' && activeUser === 'Sarah') id = 'projects';
      const next = doc.getElementById(id);
      if (!next) return;
      if (push && currentId && currentId !== id) navStack.push(currentId);
      doc.querySelectorAll('.page').forEach(page => page.classList.remove('on'));
      next.classList.add('on');
      currentId = id;
      if (id === 'projects') keepHomeShared();
      if (recovery) recovery.hidden = id === 'landing';
      try { win.scrollTo({top:0,behavior:'instant'}); } catch { win.scrollTo(0,0); }
      if (id.startsWith('alcove') && typeof win.syncAlcove === 'function') win.syncAlcove();
      if (id.startsWith('picnic') && typeof win.syncPicnic === 'function') win.syncPicnic();
      if (typeof win.syncTransaction === 'function') win.syncTransaction();
      try { win.history.replaceState(null, '', '#' + id); } catch {}
      doc.querySelectorAll('.recovery-nav button').forEach(button => {
        const target = button.getAttribute('data-go') || button.getAttribute('data-canonical-go');
        if (target === id || (target === 'my-projects' && requestedId === 'my-projects')) button.setAttribute('aria-current','step');
        else button.removeAttribute('aria-current');
      });
    }

    function canonicalBack() {
      canonicalShow(navStack.pop() || 'landing', false);
    }

    // Replace only navigation; all original project/configurator behavior stays in the frozen base.
    win.show = canonicalShow;
    win.back = canonicalBack;

    doc.addEventListener('click', event => {
      const target = event.target.closest('[data-canonical-go]');
      if (!target) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      canonicalShow(target.getAttribute('data-canonical-go'));
    }, true);

    keepHomeShared();
    if (recovery) recovery.hidden = currentId === 'landing';
  });
})();
</script>
</body>
</html>
