<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan-to-Build — System Build</title>
<meta name="stb-canonical-build" content="front-door-0.1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf9f7}
#stb-current{display:block;width:100%;height:100%;border:0;background:#faf9f7}
</style>
</head>
<body>
<iframe id="stb-current" title="Scan-to-Build System" src="system-build-base-8d8a9dd.html"></iframe>
<script>
(() => {
  const frame = document.getElementById('stb-current');
  frame.addEventListener('load', () => {
    const win = frame.contentWindow;
    const doc = win.document;
    const wrap = doc.querySelector('.wrap');
    if (!wrap) return;

    const style = doc.createElement('style');
    style.textContent = `
      .canonical-appbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:11px}
      .canonical-appbar[hidden]{display:none}
      .canonical-appbar button{font-size:11px;padding:5px 10px;background:var(--surface)}
      .canonical-appbar .spacer{flex:1}
      .canonical-appbar label{display:flex;align-items:center;gap:6px;color:var(--text2);font-weight:600;letter-spacing:.03em}
      .canonical-appbar select{font:inherit;font-size:11px;padding:4px 7px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}
      .canonical-library-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0}
      .canonical-library-card{display:block;width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:9px;background:var(--surface);text-align:left}
      .canonical-library-card b,.canonical-library-card span{display:block}
      .canonical-library-card span{margin-top:2px;color:var(--text2);font-size:12px}
      .canonical-library-card.start{grid-column:1/-1;border-color:var(--border-accent);background:var(--tint)}
      .canonical-library-note{font-size:12px;color:var(--text2)}
      @media(max-width:760px){.canonical-library-grid{grid-template-columns:1fr}}
    `;
    doc.head.append(style);

    const recovery = doc.querySelector('.recovery-nav');
    if (recovery) recovery.hidden = true;

    const appbar = doc.createElement('nav');
    appbar.className = 'canonical-appbar';
    appbar.setAttribute('aria-label', 'Application navigation');
    appbar.innerHTML = '<button type="button" data-canonical-go="home">HOME</button><button type="button" data-canonical-go="projects">MY PROJECTS</button><span class="spacer"></span><label>DEMO USER <select id="canonical-demo-user"><option>Sarah</option><option>Tom</option><option>Dick</option><option>Harry</option></select></label>';
    wrap.prepend(appbar);

    function makePage(id, mainHtml, railHtml) {
      const section = doc.createElement('section');
      section.className = 'page';
      section.id = id;
      section.innerHTML = '<div class="main">' + mainHtml + '</div><aside class="rail"><p class="hd">BUILD GUIDE</p>' + railHtml + '</aside>';
      wrap.append(section);
      return section;
    }

    makePage('home',
      '<h1>PROJECT LIBRARY</h1>' +
      '<p class="sub">Frozen bounded projects stay here as reusable starting points. Open one to see the latest published path — capture or plan, configuration, Store / reference outcome, and record where that project has them.</p>' +
      '<div class="canonical-library-grid">' +
        '<button class="canonical-library-card start" type="button" data-canonical-go="start-own"><b>+ START YOUR OWN PROJECT</b><span>Begin with a board, an idea, measurements, a scan, a drawing, or a file.</span></button>' +
        '<button class="canonical-library-card" type="button" data-canonical-go="alcove-capture"><b>Critical fit · Alcove shelf insert</b><span>Scan / measurements → configuration → Store Zero → review → record.</span></button>' +
        '<button class="canonical-library-card" type="button" data-canonical-go="window-parts"><b>Plywood curvilinear shapes</b><span>Frozen sheet-workstream definition.</span></button>' +
        '<button class="canonical-library-card" type="button" data-canonical-go="window-intake"><b>Space utilization · Window seat</b><span>Bounded project with dimensional + sheet workstreams and a declared human gate.</span></button>' +
        '<button class="canonical-library-card" type="button" data-canonical-go="picnic-chooser"><b>Outdoor build · Picnic table</b><span>Bounded form and fulfillment-scope choices.</span></button>' +
      '</div>' +
      '<p class="canonical-library-note">A library project preserves the reusable project definition. It does not transfer another user\'s private account, order, payment, address, or owner record.</p>' +
      '<div class="btns"><button type="button" data-canonical-go="projects">RETURN TO MY PROJECTS</button></div>',
      '<p class="goal">Shared starting points</p><div class="row"><b>Start your own stays first</b><span>The library never traps a person inside an existing project class.</span></div><div class="row"><b>Frozen means inspectable</b><span>Prior bounded work remains visible instead of being silently redesigned.</span></div><div class="row"><b>Identity stays separate</b><span>Public project facts do not become somebody else\'s private record.</span></div>'
    );

    makePage('archive',
      '<h1>COMPLETED PROJECTS / RECORDS</h1><p class="sub" id="canonical-archive-intro"></p><div id="canonical-archive-body"></div><div class="btns"><button type="button" data-canonical-go="projects">RETURN TO MY PROJECTS</button><button type="button" data-canonical-go="home">HOME</button></div>',
      '<p class="goal">Your chute</p><div class="row"><b>Account-scoped</b><span>Changing the demo user changes whose private records are shown.</span></div><div class="row"><b>No invented history</b><span>An empty demo account stays empty until a record actually exists.</span></div>'
    );

    const userKey = 'stb-canonical-demo-user-v1';
    const allowed = ['Sarah','Tom','Dick','Harry'];
    let activeUser = 'Sarah';
    const userSelect = doc.getElementById('canonical-demo-user');

    function renderArchive() {
      const intro = doc.getElementById('canonical-archive-intro');
      const body = doc.getElementById('canonical-archive-body');
      if (!intro || !body) return;
      intro.textContent = activeUser.toUpperCase() + ' · private demo archive';
      if (activeUser === 'Sarah') {
        body.innerHTML = '<div class="reviewbox"><p style="font-weight:600;margin-bottom:6px">Alcove insert · frozen reference record</p><p class="dim">Open the retained record path for the current bounded-project demonstration.</p><button type="button" data-canonical-go="record">OPEN RECORD</button></div>';
      } else {
        body.innerHTML = '<p><b>' + activeUser.toUpperCase() + '</b> has no completed records in this demonstration.</p><p class="dim">That is deliberate. Switching users does not expose Sarah\'s private demo record.</p>';
      }
    }

    function renderAccount(name) {
      if (!allowed.includes(name)) name = 'Sarah';
      activeUser = name;
      localStorage.setItem(userKey, name);
      if (userSelect) userSelect.value = name;
      const active = doc.getElementById('demo-active-account-name');
      if (active) active.textContent = name.toUpperCase();
      const emptyName = doc.getElementById('demo-empty-account-name');
      if (emptyName) emptyName.textContent = name.toUpperCase();
      const projects = doc.getElementById('projects');
      if (projects) {
        const split = projects.querySelector(':scope > .split');
        const empty = doc.getElementById('demo-empty-projects');
        const showSarah = name === 'Sarah';
        if (split) split.hidden = !showSarah;
        if (empty) empty.hidden = showSarah;
      }
      renderArchive();
    }

    // Sarah is the deterministic default each time the canonical build is opened.
    renderAccount('Sarah');

    if (userSelect) {
      userSelect.addEventListener('change', () => renderAccount(userSelect.value));
    }

    // Remove the four large named-account button groups from the three entry-context pages.
    doc.querySelectorAll('#new-user .demo-account-gate,#returning .demo-account-gate,#professional .demo-account-gate').forEach(node => node.remove());

    function wireDoor(pageId, destinations) {
      const buttons = [...doc.querySelectorAll('#' + pageId + ' .door-preview button')];
      buttons.forEach((button, index) => {
        button.disabled = false;
        button.removeAttribute('disabled');
        button.setAttribute('data-canonical-go', destinations[index] || 'home');
      });
    }

    // Keep the button words exactly as written; only make the existing controls work.
    wireDoor('new-user', ['projects','projects','home']);
    wireDoor('returning', ['projects','start-own','archive']);
    wireDoor('professional', ['intake','intake','intake']);

    let currentId = doc.querySelector('.page.on')?.id || 'landing';
    const navStack = [];

    function canonicalShow(id, push = true) {
      const next = doc.getElementById(id);
      if (!next) return;
      if (push && currentId && currentId !== id) navStack.push(currentId);
      doc.querySelectorAll('.page').forEach(page => page.classList.remove('on'));
      next.classList.add('on');
      currentId = id;
      appbar.hidden = id === 'landing';
      if (recovery) recovery.hidden = true;
      try { win.scrollTo({top:0,behavior:'instant'}); } catch { win.scrollTo(0,0); }
      if (id.startsWith('alcove') && typeof win.syncAlcove === 'function') win.syncAlcove();
      if (id.startsWith('picnic') && typeof win.syncPicnic === 'function') win.syncPicnic();
      if (typeof win.syncTransaction === 'function') win.syncTransaction();
      try { win.history.replaceState(null, '', '#' + id); } catch {}
    }

    function canonicalBack() {
      canonicalShow(navStack.pop() || 'landing', false);
    }

    // Replace only navigation; all existing project/configurator behavior remains in the frozen base.
    win.show = canonicalShow;
    win.back = canonicalBack;

    doc.addEventListener('click', event => {
      const target = event.target.closest('[data-canonical-go]');
      if (!target) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      canonicalShow(target.getAttribute('data-canonical-go'));
    }, true);

    appbar.hidden = currentId === 'landing';
  });
})();
</script>
</body>
</html>
